name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi necessari al deploy su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annullare quelli in corso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (abilita Pages se non lo è già)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Il sito è una singola pagina statica: pubblico solo index.html
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
