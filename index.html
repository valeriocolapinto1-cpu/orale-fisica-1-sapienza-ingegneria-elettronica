<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080e">
<title>Fisica 1 — Orale Trainer</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
:root{
  color-scheme: dark;
  --bg:#05060c;
  --bg-soft:#080a12;
  --card:rgba(18,21,36,.6);
  --card-2:rgba(26,30,50,.74);
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.08);
  --surface-3:rgba(255,255,255,.13);
  --border:rgba(140,160,255,.12);
  --border-2:rgba(140,170,255,.26);
  --fg:#eaf0ff;
  --fg2:#94a0c0;
  --fg3:#5e688a;
  --accent:#8b93ff;
  --accent-chiaro:#b7bcff;
  --accent-2:#c483ff;
  --cyan:#3ce6ff;
  --magenta:#ff6bd6;
  --accent-soft:rgba(139,147,255,.16);
  --grad:linear-gradient(135deg,#6d7bff 0%,#a366ff 60%,#c86bff 100%);
  --grad-neon:linear-gradient(135deg,#5cc8ff 0%,#8b7bff 45%,#c86bff 100%);
  --grad-txt:linear-gradient(115deg,#9fe9ff 0%,#b7bcff 40%,#e0a8ff 100%);
  --grad-soft:linear-gradient(135deg,rgba(109,123,255,.20),rgba(200,107,255,.13));
  --st0:#5a647a; --st1:#ff6b6b; --st2:#ffb454; --st3:#37e0a0;
  --st1-soft:rgba(255,107,107,.14); --st2-soft:rgba(255,180,84,.14); --st3-soft:rgba(55,224,160,.14);
  --areaA:#7fb0ff; --areaB:#4fe3ac; --areaC:#ffc266; --areaD:#cf9bff;
  --shadow:0 14px 44px -16px rgba(0,0,0,.7);
  --shadow-lg:0 30px 80px -24px rgba(0,0,0,.78);
  --glow:0 0 24px -4px rgba(124,131,255,.6);
  --glow-cyan:0 0 24px -4px rgba(60,230,255,.55);
  --hud:rgba(60,230,255,.55);
  --r:20px; --r-sm:14px; --r-xs:10px;
  --dur:.24s; --spring:cubic-bezier(.34,1.4,.5,1);
  --nav-h:66px; --sidebar-w:250px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:17px; background:var(--bg);}

/* Griglia prospettica + scanline (livello sci-fi, dietro tutto) */
html::before{
  content:""; position:fixed; inset:-2px; z-index:-3; pointer-events:none;
  background-image:
    linear-gradient(rgba(124,140,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,140,255,.055) 1px, transparent 1px);
  background-size:46px 46px;
  -webkit-mask:radial-gradient(120% 90% at 50% 8%, #000 0%, transparent 72%);
  mask:radial-gradient(120% 90% at 50% 8%, #000 0%, transparent 72%);
  animation:gridDrift 34s linear infinite;
}
html::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
}
@keyframes gridDrift{from{background-position:0 0, 0 0;} to{background-position:0 460px, 460px 0;}}

body{
  margin:0; background:transparent; color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
/* Aurora animata */
body::before{
  content:""; position:fixed; inset:-10vh -10vw; z-index:-2; pointer-events:none;
  background:
    radial-gradient(36% 32% at 12% 10%, rgba(109,123,255,.28), transparent 60%),
    radial-gradient(32% 30% at 90% 4%, rgba(200,107,255,.22), transparent 60%),
    radial-gradient(40% 40% at 82% 86%, rgba(60,230,255,.16), transparent 62%),
    radial-gradient(44% 42% at 20% 94%, rgba(163,102,255,.13), transparent 60%);
  filter:saturate(1.15);
  animation:aurora 26s ease-in-out infinite alternate;
}
body::after{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:radial-gradient(130% 120% at 50% -10%, transparent 50%, rgba(0,0,0,.6) 100%);
}
@keyframes aurora{
  0%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(1.5%,-2%,0) scale(1.08);}
  100%{transform:translate3d(-2%,2.5%,0) scale(1.12);}
}

h1,h2,h3,h4{line-height:1.22; letter-spacing:-.02em;}
h2{
  font-size:1.9rem; font-weight:800; margin:.2em 0 .7em;
  background:var(--grad-txt); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 18px rgba(124,131,255,.35));
}
h3{font-size:1.14rem; font-weight:700; margin:1em 0 .5em;}
p{margin:.55em 0;}
a{color:var(--cyan); text-underline-offset:3px;}
::selection{background:rgba(60,230,255,.3); color:#fff;}

/* ---------- Header mobile ---------- */
header.app-header{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg,rgba(6,8,16,.92),rgba(6,8,16,.6));
  backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--border);
  padding:13px 18px; padding-top:calc(13px + env(safe-area-inset-top));
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
header.app-header h1{font-size:1.06rem; margin:0; font-weight:800; display:flex; align-items:center; gap:8px;}
#countdown{
  font-size:.78rem; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums;
  padding:6px 12px; border-radius:999px; border:1px solid rgba(60,230,255,.35);
  background:rgba(60,230,255,.1); color:var(--cyan); box-shadow:var(--glow-cyan);
}

main{padding:20px 16px 44px; max-width:840px; margin:0 auto;}
.vista{display:none;}
.vista.attiva{display:block; animation:appare .5s var(--spring);}
@keyframes appare{from{opacity:0; transform:translateY(14px) scale(.99);} to{opacity:1; transform:none;}}

/* ---------- Superfici (glass + HUD) ---------- */
.card{
  position:relative; background:var(--card);
  backdrop-filter:blur(16px) saturate(1.25); -webkit-backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid var(--border); border-radius:var(--r);
  padding:20px; margin-bottom:16px; box-shadow:var(--shadow);
  transition:transform var(--dur) var(--spring), border-color var(--dur), box-shadow var(--dur);
}
.card::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%);
  -webkit-mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
  -webkit-mask-composite:xor; mask-composite:exclude; padding:1px; opacity:.6;
}
.card:hover{border-color:var(--border-2); box-shadow:var(--shadow), var(--glow);}
.mini{color:var(--fg2); font-size:.86rem;}
.avviso{
  position:relative; overflow:hidden;
  background:var(--grad-soft); border:1px solid rgba(139,147,255,.3); border-radius:var(--r);
  padding:15px 18px; margin-bottom:16px; font-size:.95rem; box-shadow:var(--shadow), var(--glow);
}
.etichetta-sez{
  font-size:.72rem; text-transform:uppercase; letter-spacing:.16em;
  color:var(--cyan); font-weight:800; margin:18px 0 8px; opacity:.85;
}
.vuoto{color:var(--fg2); font-style:italic; padding:6px 0;}

/* ---------- Bottoni ---------- */
button, .btn{
  font:inherit; cursor:pointer; border:1px solid transparent; border-radius:var(--r-sm);
  background:var(--surface-2); color:var(--fg); padding:12px 18px; min-height:48px;
  font-weight:650; letter-spacing:-.01em;
  transition:background var(--dur), transform .16s var(--spring), color var(--dur), border-color var(--dur), box-shadow var(--dur);
}
button:hover{background:var(--surface-3);}
button:active{transform:scale(.96);}
.btn-primario{
  position:relative; overflow:hidden;
  background:var(--grad); color:#fff; border:none;
  box-shadow:0 10px 28px -10px rgba(124,131,255,.85), 0 0 22px -6px rgba(200,107,255,.6), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-primario:hover{transform:translateY(-2px); box-shadow:0 16px 38px -10px rgba(124,131,255,.95), 0 0 30px -6px rgba(60,230,255,.6), inset 0 1px 0 rgba(255,255,255,.3);}
.btn-primario:active{transform:translateY(0) scale(.98);}
.btn-primario::after{
  content:""; position:absolute; top:0; left:-120%; width:70%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-18deg);
}
.btn-primario:hover::after{animation:sheen .9s ease;}
@keyframes sheen{to{left:130%;}}
.btn-largo{display:block; width:100%; text-align:center; margin-top:12px;}
.btn-fantasma{background:none; color:var(--fg2); font-weight:650; border-color:transparent;}
.btn-fantasma:hover{background:var(--surface); color:var(--fg);}

/* ---------- Tag e stati ---------- */
.tag{
  display:inline-flex; align-items:center; font-size:.7rem; font-weight:800; padding:3px 11px; border-radius:999px;
  background:var(--surface-2); color:var(--fg2); margin-right:8px; vertical-align:middle;
  border:1px solid var(--border); letter-spacing:.03em;
}
.tag-A{color:var(--areaA); background:rgba(127,176,255,.14); border-color:rgba(127,176,255,.34);}
.tag-B{color:var(--areaB); background:rgba(79,227,172,.13); border-color:rgba(79,227,172,.34);}
.tag-C{color:var(--areaC); background:rgba(255,194,102,.13); border-color:rgba(255,194,102,.34);}
.tag-D{color:var(--areaD); background:rgba(207,155,255,.14); border-color:rgba(207,155,255,.34);}
.stato-pallino{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:10px; flex:none; transition:background var(--dur), box-shadow var(--dur);}
.st-0{background:var(--st0);}
.st-1{background:var(--st1); box-shadow:0 0 10px -1px var(--st1);}
.st-2{background:var(--st2); box-shadow:0 0 10px -1px var(--st2);}
.st-3{background:var(--st3); box-shadow:0 0 10px -1px var(--st3);}
.bordo-st-0{box-shadow:inset 3px 0 0 var(--st0);} .bordo-st-1{box-shadow:inset 3px 0 0 var(--st1);}
.bordo-st-2{box-shadow:inset 3px 0 0 var(--st2);} .bordo-st-3{box-shadow:inset 3px 0 0 var(--st3);}

/* ---------- Liste argomenti ---------- */
.lista-argomenti{list-style:none; margin:0; padding:0;}
.riga-argomento{
  display:flex; align-items:center; width:100%; text-align:left; gap:8px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:15px 16px; margin-bottom:10px; min-height:56px; font-weight:550;
  transition:transform var(--dur) var(--spring), border-color var(--dur), background var(--dur), box-shadow var(--dur);
}
.riga-argomento:hover{background:var(--card-2); border-color:var(--border-2); transform:translateX(4px); box-shadow:var(--glow);}
.riga-argomento .titolo-arg{flex:1; font-size:.94rem;}
.riga-argomento .freccia{color:var(--fg3); transition:transform var(--dur), color var(--dur);}
.riga-argomento:hover .freccia{color:var(--cyan); transform:translateX(3px);}
.chip-arg{
  display:flex; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xs);
  padding:12px 14px; margin:8px 0; font-size:.89rem; min-height:48px; font-weight:550;
  transition:background var(--dur), border-color var(--dur), transform var(--dur) var(--spring);
}
.chip-arg:hover{background:var(--surface-2); border-color:var(--border-2); transform:translateX(3px);}

/* ---------- Sezioni collassabili ---------- */
details.sezione{background:var(--card); border:1px solid var(--border); border-radius:var(--r); margin-bottom:12px; overflow:hidden; transition:border-color var(--dur);}
details.sezione[open]{border-color:var(--border-2);}
details.sezione>summary{
  cursor:pointer; list-style:none; padding:16px 18px; font-weight:750; font-size:1rem;
  display:flex; align-items:center; justify-content:space-between; min-height:52px;
  transition:background var(--dur), color var(--dur);
}
details.sezione>summary:hover{background:var(--surface);}
details.sezione>summary::-webkit-details-marker{display:none;}
details.sezione>summary::after{content:"›"; color:var(--fg3); font-size:1.4rem; line-height:1; transition:transform var(--dur), color var(--dur);}
details.sezione[open]>summary::after{transform:rotate(90deg); color:var(--cyan);}
details.sezione[open]>summary{color:var(--accent-chiaro);}
details.sezione .corpo{padding:2px 18px 18px; animation:corpoIn .32s ease;}
@keyframes corpoIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
.passo-derivazione{border-left:3px solid var(--accent); padding:8px 0 8px 16px; margin:16px 0; background:linear-gradient(90deg,var(--surface),transparent); border-radius:2px;}
.passo-derivazione .p-passo{font-weight:750; font-size:.93rem;}
.passo-derivazione .p-formula{margin:8px 0; overflow-x:auto; padding:4px 0;}
.passo-derivazione .p-commento{color:var(--fg2); font-size:.88rem;}
ul.puntata{margin:.3em 0; padding-left:1.25em;}
ul.puntata li{margin-bottom:.5em;}
ul.puntata li::marker{color:var(--cyan);}

/* ---------- Anelli di progresso ---------- */
.anelli{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:8px;}
.anello{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;}
.anello svg{transform:rotate(-90deg); filter:drop-shadow(0 0 8px rgba(124,131,255,.5));}
.anello .traccia{stroke:var(--surface-2); fill:none;}
.anello .valore{fill:none; stroke-linecap:round; transition:stroke-dashoffset 1s var(--spring);}
.anello .perc{font-weight:800; font-size:1.05rem; margin-top:-46px; height:40px; display:flex; align-items:center; font-variant-numeric:tabular-nums;}
.anello .nome{font-size:.72rem; color:var(--fg2); margin-top:8px; line-height:1.3; font-weight:600;}
.legenda-stati{display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; font-size:.78rem; color:var(--fg2);}
.legenda-stati span{display:flex; align-items:center;}

/* ---------- Griglie voto ---------- */
.griglia-stati{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px;}
.griglia-stati button{font-size:.88rem; padding:14px 6px; border:1px solid var(--border);}
.griglia-stati button:hover{border-color:var(--border-2);}
.punto-checklist{display:flex; flex-direction:column; gap:10px; padding:14px 0;}
.punto-checklist + .punto-checklist{border-top:1px solid var(--border);}
.voti-03{display:flex; gap:10px;}
.voti-03 button{flex:1; min-height:48px; font-weight:800; border:1px solid var(--border);}
.voti-03 button.sel{background:var(--grad); color:#fff; border-color:transparent; box-shadow:var(--glow);}
#timer-display{
  font-size:3.6rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; margin:16px 0; letter-spacing:.04em;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  background:var(--grad-txt); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 22px rgba(60,230,255,.45));
}

/* ---------- Formulario ---------- */
.formula-riga{padding:12px 4px; overflow-x:auto;}
.formula-riga + .formula-riga{border-top:1px solid var(--border);}
.formula-riga .mini{display:block; margin-bottom:3px;}

/* ---------- Navigazione ---------- */
nav#navbar{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  display:flex;
  background:linear-gradient(180deg,rgba(8,10,20,.72),rgba(5,6,14,.94));
  backdrop-filter:blur(22px) saturate(1.5); -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
nav#navbar .brand{display:none;}
nav#navbar button{
  flex:1; min-width:0; background:none; border:none; border-radius:0; color:var(--fg2);
  font-size:.52rem; font-weight:750; letter-spacing:0; white-space:nowrap; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; min-height:var(--nav-h); padding:6px 1px;
  position:relative; transition:color var(--dur);
}
nav#navbar button .icona{font-size:1.22rem; line-height:1; transition:transform .3s var(--spring), filter var(--dur);}
nav#navbar button.attivo{color:var(--cyan);}
nav#navbar button.attivo .icona{transform:translateY(-2px) scale(1.16); filter:drop-shadow(0 4px 12px rgba(60,230,255,.8));}
nav#navbar button.attivo::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:30px; height:3px; border-radius:0 0 4px 4px; background:var(--grad-neon);
  box-shadow:0 0 14px rgba(60,230,255,.95); animation:navPop .3s var(--spring);
}
@keyframes navPop{from{width:0; opacity:0;} to{width:30px; opacity:1;}}
#countdown-nav{display:none;}

/* ---------- Scheda a schermo intero ---------- */
#scheda-overlay{
  position:fixed; inset:0; z-index:80; background:var(--bg-soft);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  opacity:0; transform:translateY(26px) scale(.985); pointer-events:none;
  transition:opacity .28s ease, transform .32s var(--spring);
}
#scheda-overlay.aperta{opacity:1; transform:none; pointer-events:auto;}
#scheda-overlay .contenuto{max-width:840px; margin:0 auto; padding:14px 16px 90px;}
#scheda-overlay .barra-scheda{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
  background:linear-gradient(180deg,rgba(8,10,18,.94),rgba(8,10,18,.55));
  backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--border);
  padding:12px 0; padding-top:calc(12px + env(safe-area-inset-top)); margin:0 -16px; padding-left:16px; padding-right:16px;
}
.titolo-scheda{
  font-size:1.62rem; font-weight:800; margin:.55em 0 .35em; line-height:1.22;
  background:var(--grad-txt); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 16px rgba(124,131,255,.3));
}

/* ---------- Simulazioni interattive ---------- */
.sim-box canvas{width:100%; display:block; border-radius:var(--r-sm); background:rgba(12,15,26,.72); border:1px solid var(--border); margin-bottom:12px;}
.sim-controlli{display:flex; flex-direction:column; gap:6px;}
.sim-riga{display:flex; align-items:center; gap:12px; min-height:46px;}
.sim-riga label{flex:0 0 34%; font-size:.85rem; color:var(--fg2); font-weight:650;}
.sim-riga input[type=range]{flex:1; accent-color:var(--accent); min-height:44px; margin:0;}
.sim-riga output{flex:0 0 78px; text-align:right; font-variant-numeric:tabular-nums; font-size:.88rem; font-weight:800; color:var(--cyan);}
.sim-legenda{font-size:.84rem; color:var(--fg2); margin-top:8px;}

/* ---------- Spiegazione in evidenza (intuizione) ---------- */
.spiegazione-hero{
  position:relative; overflow:hidden;
  background:var(--grad-soft); border:1px solid rgba(139,147,255,.28); border-radius:var(--r);
  padding:20px; margin:14px 0; box-shadow:var(--shadow), var(--glow);
}
.spiegazione-hero::before{content:""; position:absolute; inset:0; z-index:0; pointer-events:none; background:radial-gradient(80% 130% at 0% 0%, rgba(60,230,255,.14), transparent 55%);}
.spiegazione-hero h4{position:relative; margin:0 0 7px; font-size:.76rem; text-transform:uppercase; letter-spacing:.14em; color:var(--cyan); font-weight:800;}
.spiegazione-hero p{position:relative; margin:0; font-size:1.02rem; line-height:1.62;}

/* ---------- Controllo segmentato ---------- */
.segmentato{display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:5px; gap:5px; flex-wrap:wrap;}
.segmentato button{background:none; min-height:40px; padding:9px 15px; border-radius:10px; font-size:.86rem; color:var(--fg2); font-weight:750; border:none;}
.segmentato button:hover{background:var(--surface-2);}
.segmentato button.sel{background:var(--grad); color:#fff; box-shadow:var(--glow);}
.segmentato.pieno{display:flex; width:100%;}
.segmentato.pieno button{flex:1;}

/* ---------- Checklist durante la simulazione ---------- */
.checklist-sim{list-style:none; margin:8px 0 0; padding:0;}
.checklist-sim li{
  display:flex; align-items:flex-start; gap:12px; padding:12px 14px; margin-bottom:9px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xs); font-size:.9rem; cursor:pointer;
  transition:background var(--dur), opacity var(--dur), transform var(--dur) var(--spring), border-color var(--dur);
}
.checklist-sim li:hover{background:var(--surface-2); transform:translateX(3px);}
.checklist-sim li .box{
  flex:none; width:23px; height:23px; border-radius:7px; border:2px solid var(--fg3);
  display:flex; align-items:center; justify-content:center; font-size:.82rem; color:#08120d;
  transition:background var(--dur) var(--spring), border-color var(--dur), transform var(--dur) var(--spring); margin-top:1px;
}
.checklist-sim li.fatto{opacity:.6; border-color:rgba(55,224,160,.4);}
.checklist-sim li.fatto .box{background:var(--st3); border-color:var(--st3); transform:scale(1.05); box-shadow:0 0 10px rgba(55,224,160,.7);}
.checklist-sim li.fatto .testo{text-decoration:line-through; color:var(--fg2);}

/* ---------- Vista QUIZ / TEORIA ---------- */
.quiz-scelte{display:flex; flex-wrap:wrap; gap:9px; margin:10px 0 4px;}
.chip-scelta{
  background:var(--surface); color:var(--fg2); border:1px solid var(--border); border-radius:999px; padding:10px 16px;
  font-size:.86rem; font-weight:750; min-height:44px; transition:background var(--dur), color var(--dur), border-color var(--dur), transform var(--dur) var(--spring), box-shadow var(--dur);
}
.chip-scelta:hover{transform:translateY(-2px); border-color:var(--border-2);}
.chip-scelta.sel{background:var(--accent-soft); color:var(--accent-chiaro); border-color:transparent; box-shadow:inset 0 0 0 1.5px var(--accent), var(--glow);}
.quiz-barra{height:9px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:4px 0 2px; border:1px solid var(--border);}
.quiz-barra span{display:block; height:100%; background:var(--grad-neon); background-size:200% 100%; width:0; border-radius:999px; transition:width .5s var(--spring); box-shadow:0 0 14px rgba(60,230,255,.7); animation:scorri 3s linear infinite;}
.quiz-meta{display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--fg2); margin-bottom:12px; font-variant-numeric:tabular-nums;}
.quiz-tipo-tag{font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:var(--cyan); font-weight:800; margin-bottom:2px; opacity:.9;}
.quiz-domanda{font-size:1.16rem; font-weight:750; line-height:1.45; margin:6px 0 4px;}
.quiz-contesto{
  position:relative; margin:12px 0 4px; padding:14px 16px; border-radius:var(--r-sm);
  background:rgba(60,230,255,.06); border:1px solid rgba(60,230,255,.2); font-size:1.02rem; line-height:1.55; font-style:italic; color:#e6f6ff;
}
.quiz-contesto::before{content:"“"; position:absolute; top:-6px; left:8px; font-size:2rem; color:rgba(60,230,255,.4); font-style:normal;}
.quiz-opzioni{display:flex; flex-direction:column; gap:11px; margin-top:16px;}
.quiz-opt{
  text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r-sm);
  padding:15px 16px; font-weight:550; font-size:.95rem; min-height:54px; line-height:1.4;
  display:flex; align-items:center; gap:13px; transition:background var(--dur), border-color var(--dur), transform var(--dur) var(--spring), box-shadow var(--dur);
}
.quiz-opt .lettera{flex:none; width:28px; height:28px; border-radius:9px; background:var(--surface-3); color:var(--fg2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.82rem; transition:background var(--dur), color var(--dur);}
.quiz-opt:hover:not(:disabled){background:var(--surface-2); border-color:var(--border-2); transform:translateX(3px); box-shadow:var(--glow);}
.quiz-opt:hover:not(:disabled) .lettera{background:var(--accent-soft); color:var(--accent-chiaro);}
.quiz-opt.giusta{border-color:var(--st3); background:var(--st3-soft); box-shadow:0 0 26px -6px var(--st3);}
.quiz-opt.giusta .lettera{background:var(--st3); color:#08120d;}
.quiz-opt.sbagliata{border-color:var(--st1); background:var(--st1-soft);}
.quiz-opt.sbagliata .lettera{background:var(--st1); color:#1a0808;}
.quiz-opt.attenua{opacity:.42;}
.quiz-esito{margin-top:14px; padding:13px 16px; border-radius:var(--r-sm); font-size:.92rem; font-weight:700; animation:esitoIn .34s var(--spring);}
@keyframes esitoIn{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
.quiz-esito.ok{background:var(--st3-soft); color:#9df3c8; border:1px solid rgba(55,224,160,.3);}
.quiz-esito.no{background:var(--st1-soft); color:#ffb0b0; border:1px solid rgba(255,107,107,.3);}
.quiz-flash-risposta{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:15px 16px; margin-top:12px; animation:esitoIn .3s var(--spring); line-height:1.55;}
.quiz-flash-risposta .mini{display:block; margin-bottom:4px;}
.quiz-punteggio{
  font-size:3.6rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; margin:6px 0;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  background:var(--grad-txt); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 24px rgba(60,230,255,.45)); animation:punteggioPop .6s var(--spring);
}
@keyframes punteggioPop{from{opacity:0; transform:scale(.6);} to{opacity:1; transform:none;}}
.quiz-badge{display:inline-block; font-size:1rem; font-weight:800; padding:7px 18px; border-radius:999px; margin:2px 0 8px; border:1px solid var(--border);}

/* ---------- Vista FLASHCARD (flip 3D + HUD) ---------- */
.flash-scene{perspective:1600px; margin:10px 0 16px;}
.flip-card{position:relative; width:100%; min-height:360px; cursor:pointer; transform-style:preserve-3d; transition:transform .62s var(--spring);}
.flip-card.girata{transform:rotateY(180deg);}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; border-radius:var(--r); border:1px solid var(--border-2);
  padding:24px 22px; overflow:auto; box-shadow:var(--shadow);
}
.flip-face .fc-tag{font-size:.68rem; text-transform:uppercase; letter-spacing:.16em; font-weight:800; margin-bottom:12px;}
.flip-face .fc-corpo{flex:1; display:flex; flex-direction:column; justify-content:center;}
.flip-face .fc-hint{margin-top:14px; font-size:.76rem; color:var(--fg3); text-transform:uppercase; letter-spacing:.1em; font-weight:700;}
.flip-front{background:var(--card-2); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.flip-front .fc-tag{color:var(--cyan);}
.flip-front .fc-domanda{font-size:1.35rem; font-weight:800; line-height:1.35;}
.flip-back{background:linear-gradient(160deg,rgba(30,26,54,.85),rgba(18,20,40,.9)); transform:rotateY(180deg);}
.flip-back .fc-tag{color:var(--accent-2);}
.flip-back .fc-risposta{font-size:1.02rem; line-height:1.6;}
.flip-back .fc-risposta ul{margin:.3em 0; padding-left:1.2em;}
.flip-back .fc-risposta li{margin-bottom:.4em;}
.flip-back .fc-risposta li::marker{color:var(--accent-2);}
/* angoli HUD */
.flip-face::before, .flip-face::after{content:""; position:absolute; width:18px; height:18px; border:2px solid var(--hud); pointer-events:none; opacity:.8;}
.flip-face::before{top:10px; left:10px; border-right:none; border-bottom:none; border-radius:4px 0 0 0;}
.flip-face::after{bottom:10px; right:10px; border-left:none; border-top:none; border-radius:0 0 4px 0;}
.flash-nav{display:flex; align-items:center; gap:10px; margin-top:4px;}
.flash-nav .conta{flex:1; text-align:center; font-variant-numeric:tabular-nums; font-weight:800; color:var(--fg2); letter-spacing:.05em;}
.flash-nav button{min-width:64px;}

/* ---------- Vista DIMOSTRAZIONI (rivela passo-passo) ---------- */
.dim-goal{position:relative; margin:12px 0 6px; padding:15px 16px; border-radius:var(--r-sm); background:var(--grad-soft); border:1px solid rgba(139,147,255,.3); box-shadow:var(--glow);}
.dim-goal .cap{display:block; margin-bottom:8px; font-size:.7rem; text-transform:uppercase; letter-spacing:.14em; font-weight:800; color:var(--accent-chiaro);}
.dim-goal .formula-riga{padding:6px 0; overflow-x:auto;}
.dim-goal .formula-riga + .formula-riga{border-top:1px solid var(--border);}
.passo-dim{animation:esitoIn .38s var(--spring);}
.dim-prompt{color:var(--fg2); font-size:.9rem; margin:6px 0 2px;}
.dim-restanti{text-align:center; color:var(--fg3); font-size:.82rem; font-weight:700; letter-spacing:.03em; margin-top:10px;}
.dim-completa{text-align:center; padding:12px; border-radius:var(--r-sm); background:var(--st3-soft); border:1px solid rgba(55,224,160,.3); color:#9df3c8; font-weight:800; margin-top:6px;}
.dim-nav{display:flex; align-items:center; gap:10px; margin-top:16px;}
.dim-nav .conta{flex:1; text-align:center; font-variant-numeric:tabular-nums; font-weight:800; color:var(--fg2); letter-spacing:.04em;}
.dim-nav button{min-width:96px;}

/* ---------- Micro-animazioni (comparse a cascata) ---------- */
@keyframes entra{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
.stagger > *{opacity:0; animation:entra .5s var(--spring) forwards;}
.stagger > *:nth-child(1){animation-delay:.03s;} .stagger > *:nth-child(2){animation-delay:.07s;}
.stagger > *:nth-child(3){animation-delay:.11s;} .stagger > *:nth-child(4){animation-delay:.15s;}
.stagger > *:nth-child(5){animation-delay:.19s;} .stagger > *:nth-child(6){animation-delay:.23s;}
.stagger > *:nth-child(7){animation-delay:.27s;} .stagger > *:nth-child(8){animation-delay:.31s;}
.stagger > *:nth-child(9){animation-delay:.35s;} .stagger > *:nth-child(n+10){animation-delay:.39s;}
.barra-totale{height:13px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:6px; position:relative; border:1px solid var(--border);}
.barra-totale span{display:block; height:100%; border-radius:999px; width:0; background:linear-gradient(90deg,#5cc8ff,#8b7bff,#c86bff,#37e0a0); background-size:200% 100%; transition:width 1s var(--spring); animation:scorri 4s linear infinite; box-shadow:0 0 18px rgba(60,230,255,.6);}
@keyframes scorri{to{background-position:200% 0;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important;}
  .stagger > *{opacity:1;}
  html::before, body::before{animation:none;}
  .vista.attiva{animation:none;}
}

mjx-container{overflow-x:auto; overflow-y:hidden; max-width:100%;}
mjx-container[display="true"]{margin:.4em 0 !important;}

/* ---------- Desktop: sidebar ---------- */
@media (min-width:900px){
  body{padding-bottom:40px; padding-left:var(--sidebar-w);}
  header.app-header{display:none;}
  main{padding-top:40px;}
  nav#navbar{
    top:0; bottom:0; right:auto; width:var(--sidebar-w);
    flex-direction:column; justify-content:flex-start; align-items:stretch;
    padding:24px 14px; gap:5px; height:auto;
    background:linear-gradient(180deg,rgba(10,12,24,.68),rgba(6,8,16,.5));
    border-top:none; border-right:1px solid var(--border);
  }
  nav#navbar .brand{
    display:flex; flex-direction:column; font-weight:800; font-size:1.2rem; line-height:1.3;
    padding:0 12px 18px; gap:2px;
    background:var(--grad-txt); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  nav#navbar .brand span{font-size:.76rem; color:var(--fg2); font-weight:650; -webkit-text-fill-color:var(--fg2);}
  nav#navbar button{
    flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:13px;
    font-size:.92rem; padding:12px 15px; border-radius:var(--r-sm); min-height:48px; width:100%;
  }
  nav#navbar button .icona{font-size:1.18rem;}
  nav#navbar button:hover{background:var(--surface);}
  nav#navbar button.attivo{background:var(--grad-soft); box-shadow:inset 0 0 0 1px rgba(139,147,255,.32), var(--glow);}
  nav#navbar button.attivo::before{top:50%; left:0; transform:translateY(-50%); width:3px; height:22px; border-radius:0 4px 4px 0; animation:none;}
  #countdown-nav{display:block; margin-top:auto; padding:12px 15px; color:var(--cyan); font-weight:800; font-size:.9rem; font-variant-numeric:tabular-nums; border-radius:var(--r-sm); background:rgba(60,230,255,.09); border:1px solid rgba(60,230,255,.28);}
  #scheda-overlay .contenuto{padding-left:24px; padding-right:24px;}
}

/* ---------- Stampa: solo formulario ---------- */
@media print{
  html,body{background:#fff; color:#000; padding:0;}
  html::before, html::after, body::before, body::after{display:none !important;}
  header.app-header, nav#navbar, .no-print, #scheda-overlay{display:none !important;}
  .vista{display:none !important;}
  #vista-formulario{display:block !important;}
  .card{background:#fff; border:1px solid #bbb; break-inside:avoid; box-shadow:none;}
  .card::before{display:none;}
  h2{color:#000; -webkit-text-fill-color:#000; filter:none;}
  .formula-riga + .formula-riga{border-color:#ddd;}
  .mini{color:#555;}
  .tag{color:#333; background:#eee; border-color:#ccc;}
}

  derivazione: [

    { passo: "Caso sottosmorzato (γ < ω₀)", formula: "\\[ x(t) = A\\,e^{-\\gamma t}\\cos(\\omega_s t + \\varphi), \\qquad \\omega_s = \\sqrt{\\omega_0^2 - \\gamma^2} \\]", commento: "Le radici sono complesse coniugate: oscillazione a pulsazione ω_s < ω₀ dentro un inviluppo esponenziale Ae^{−γt}. Il tempo caratteristico di decadimento dell'ampiezza è τ = 1/γ." },

{
  id: 28, titolo: "Primo principio della termodinamica", area: "D", prerequisiti: [10, 26],
  definizioni: "Il primo principio della termodinamica è la conservazione dell'energia estesa ai fenomeni termici: la variazione di energia interna di un sistema è \\(\\Delta U = Q - W\\), dove Q è il calore assorbito DAL sistema e W il lavoro compiuto DAL sistema (convenzione usuale in Fisica 1). U è una funzione di stato (dipende solo dallo stato del sistema), mentre Q e W dipendono dalla trasformazione: in forma infinitesima \\(dU = \\delta Q - \\delta W\\), con δ a ricordare che calore e lavoro non sono differenziali esatti.",
  derivazione: [
    { passo: "Lavoro di espansione quasi-statica", formula: "\\[ \\delta W = F\\,dx = pA\\,dx = p\\,dV \\;\\Rightarrow\\; W = \\int_{V_1}^{V_2} p\\,dV \\]", commento: "Un gas che spinge un pistone di area A compie lavoro p dV. Graficamente W è l'area sotto la curva nel piano p-V: dipende dal cammino, non solo dagli estremi." },
    { passo: "U è funzione di stato (fondamento sperimentale)", formula: "\\[ W_{adiabatico} = -\\Delta U \\;\\;\\text{indipendente dal cammino} \\]", commento: "Esperimenti di Joule: per portare adiabaticamente un sistema da uno stato A a uno stato B serve sempre lo stesso lavoro, comunque lo si esegua (mulinello, resistenza...). Questo permette di DEFINIRE U." },
    { passo: "Definizione operativa del calore", formula: "\\[ Q \\equiv \\Delta U + W \\]", commento: "In una trasformazione non adiabatica il bilancio W = −ΔU fallisce: il calore è per definizione l'energia scambiata per via non meccanica (differenza di temperatura). Il primo principio diventa: l'energia si conserva contando ENTRAMBI i canali." },
    { passo: "Applicazione alle trasformazioni del gas perfetto", formula: "\\[ \\begin{aligned} &\\text{isocora: } W = 0,\\; Q = \\Delta U = nc_V\\Delta T \\\\ &\\text{isobara: } W = p\\Delta V = nR\\Delta T,\\; Q = nc_p\\Delta T \\\\ &\\text{isoterma: } \\Delta U = 0,\\; Q = W = nRT\\ln\\frac{V_2}{V_1} \\\\ &\\text{adiabatica: } Q = 0,\\; W = -\\Delta U = nc_V(T_1 - T_2) \\end{aligned} \\]", commento: "Il quartetto fondamentale. Per l'isoterma: W = ∫nRT dV/V = nRT ln(V₂/V₁). Ogni riga discende dal primo principio più l'equazione di stato." },
    { passo: "Derivazione dell'equazione delle adiabatiche", formula: "\\[ 0 = nc_V\\,dT + p\\,dV \\;\\xrightarrow{pV = nRT}\\; \\frac{dT}{T} = -\\frac{R}{c_V}\\frac{dV}{V} \\;\\Rightarrow\\; TV^{\\gamma-1} = \\text{cost}, \\quad pV^{\\gamma} = \\text{cost} \\]", commento: "Da δQ = 0: dU = −pdV; elimino T con l'equazione di stato e integro (R/c_V = γ−1). Le adiabatiche nel piano p-V sono più ripide delle isoterme di un fattore γ." }

  ipotesi: "Sistema chiuso (non scambia materia); per W = ∫p dV trasformazioni quasi-statiche (p definita a ogni istante); convenzione dei segni dichiarata esplicitamente (Q > 0 assorbito, W > 0 compiuto dal sistema).",
  casiLimite: "Trasformazione ciclica: ΔU = 0 ⇒ Q = W (tutto il calore netto diventa lavoro netto e viceversa). Adiabatica: Q = 0. Espansione libera (nel vuoto): W = 0 e Q = 0 ⇒ ΔU = 0, ma NON è quasi-statica: niente W = ∫p dV.",

{
  id: 29, titolo: "Secondo principio della termodinamica", area: "D", prerequisiti: [28],
  definizioni: "Il secondo principio stabilisce l'irreversibilità dei processi naturali attraverso due enunciati equivalenti. Kelvin-Planck: è impossibile una trasformazione ciclica il cui UNICO risultato sia convertire integralmente in lavoro il calore prelevato da una sola sorgente. Clausius: è impossibile una trasformazione ciclica il cui UNICO risultato sia trasferire calore da un corpo freddo a uno caldo. Una macchina termica deve quindi sempre cedere calore a una sorgente fredda: il rendimento \\(\\eta = W/Q_{ass} = 1 - Q_{ced}/Q_{ass}\\) è sempre minore di 1.",
  derivazione: [
    { passo: "Schema della macchina termica e rendimento", formula: "\\[ W = Q_C - |Q_F|, \\qquad \\eta = \\frac{W}{Q_C} = 1 - \\frac{|Q_F|}{Q_C} \\]", commento: "In un ciclo ΔU = 0, quindi il lavoro netto è la differenza tra calore assorbito dalla sorgente calda e calore ceduto alla fredda. Kelvin-Planck vieta |Q_F| = 0, cioè η = 1." },
    { passo: "¬Clausius ⇒ ¬Kelvin (prima metà dell'equivalenza)", formula: "\\[ \\text{frigo perfetto} + \\text{macchina reale} \\Rightarrow \\text{motore perfetto} \\]", commento: "Se esistesse un frigorifero perfetto (calore da freddo a caldo senza lavoro), lo accoppio a una macchina reale: il frigo restituisce alla sorgente calda il calore che la macchina cede alla fredda. Il sistema composto preleva calore SOLO dalla sorgente calda e lo converte tutto in lavoro: violato Kelvin-Planck." },
    { passo: "¬Kelvin ⇒ ¬Clausius (seconda metà)", formula: "\\[ \\text{motore perfetto} + \\text{frigorifero reale} \\Rightarrow \\text{frigo perfetto} \\]", commento: "Se esistesse un motore perfetto, uso il suo lavoro per azionare un frigorifero reale: il sistema composto sposta calore dal freddo al caldo senza alcun apporto esterno di lavoro: violato Clausius. Le due negazioni si implicano a vicenda: gli enunciati sono equivalenti." },
    { passo: "Reversibilità e irreversibilità", formula: "\\[ \\text{reversibile} \\iff \\text{quasi-statica e senza attriti/dissipazioni} \\]", commento: "Una trasformazione è reversibile se può essere invertita riportando sistema E ambiente allo stato iniziale. Attrito, diffusione, passaggio di calore con differenza finita di temperatura, espansione libera: tutti irreversibili. Il secondo principio codifica questa freccia." },
    { passo: "Macchine frigorifere e coefficiente di prestazione", formula: "\\[ \\text{COP}_{frigo} = \\frac{Q_F}{W}, \\qquad \\text{COP}_{pompa} = \\frac{Q_C}{W} = \\text{COP}_{frigo} + 1 \\]", commento: "Il ciclo percorso al contrario assorbe lavoro per spostare calore dal freddo al caldo: Clausius impone W > 0 (il COP è finito, ma può superare 1: non è un rendimento)." }

  ipotesi: "Sistemi che operano in CICLI (lo stato finale della macchina uguale all'iniziale: essenziale per la parola 'unico risultato'); sorgenti termiche ideali (capacità infinita, temperatura costante).",

{

  definizioni: "Il ciclo di Carnot è il ciclo reversibile compiuto tra DUE sole sorgenti termiche (T_C calda e T_F fredda), composto da quattro trasformazioni quasi-statiche: espansione isoterma a T_C, espansione adiabatica da T_C a T_F, compressione isoterma a T_F, compressione adiabatica di ritorno a T_C. Per un gas perfetto il suo rendimento vale \\(\\eta_{Carnot} = 1 - T_F/T_C\\): dipende solo dalle temperature delle sorgenti.",

// ============================================================
// Costanti e stato
// ============================================================
const AREE = {
  A: "Cinematica e oscillazioni",
  B: "Lavoro ed energia",
  C: "Sistemi di punti e corpo rigido",
  D: "Fluidi e termodinamica"
};
const STATI = ["Mai visto", "Debole", "Consolidato", "Padroneggiato"];
const CHIAVE_LS = "fisica1-orale-v1";
const AMBITO = "Fisica 1 — Ingegneria (programma tipico)";

function dataISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function oggiData() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
// Data d'esame impostata dall'utente (ISO "YYYY-MM-DD") o null se non impostata
function dataEsame() {
  const iso = stato.dataEsame;
  if (!iso) return null;
  const p = iso.split("-");
  const e = new Date(+p[0], +p[1] - 1, +p[2]); e.setHours(0, 0, 0, 0);
  return isNaN(e) ? null : e;
}
// Giorni all'esame: null se nessuna data impostata
function giorniAllEsame() {
  const e = dataEsame();
  if (!e) return null;
  return Math.round((e - oggiData()) / 86400000);
}
function impostaDataEsame(iso) {
  stato.dataEsame = iso || null;
  salvaStato();
  aggiornaCountdown();
  renderOggi();
}
function aggiungiGiorni(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function formattaData(d) { return d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "long" }); }

let stato = caricaStato();
function caricaStato() {
  try {
    const raw = localStorage.getItem(CHIAVE_LS);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* localStorage non disponibile: si lavora in memoria */ }
  return { argomenti: {}, simulazioni: {} };
}
function salvaStato() {
  try { localStorage.setItem(CHIAVE_LS, JSON.stringify(stato)); } catch (e) { }
}
function recArg(id) {
  if (!stato.argomenti[id]) stato.argomenti[id] = { stato: 0, ef: 2.3, intervallo: 0, prossimoRipasso: null };
  return stato.argomenti[id];
}

// ============================================================
// SM-2 semplificato: qualità 0-3 per singola revisione
// ============================================================
function registraRevisione(id, q) {
  const r = recArg(id);
  r.ef = Math.min(2.8, Math.max(1.3, r.ef + 0.1 - (3 - q) * 0.16));
  if (q <= 1) {
    r.intervallo = 1;
  } else if (r.intervallo === 0) {
    r.intervallo = (q === 3) ? 2 : 1;
  } else {
    r.intervallo = Math.min(10, Math.round(r.intervallo * r.ef));
  }
  r.stato = (q <= 1) ? 1 : (q === 2) ? 2 : 3;
  r.ultimaRevisione = dataISO(oggiData());
  r.prossimoRipasso = dataISO(aggiungiGiorni(oggiData(), r.intervallo));
  salvaStato();
}

function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise(el ? [el] : undefined).catch(function () { });
  } else {
    setTimeout(function () { typeset(el); }, 400);
  }
}

// ============================================================
// Piano di studio: distribuzione pesata sui giorni rimanenti
// ============================================================
function costruiscePiano() {
  const oggi = oggiData();
  const totGiorni = giorniAllEsame();
  const giorni = [];
  for (let i = 0; i < totGiorni; i++) {
    giorni.push({ data: aggiungiGiorni(oggi, i), nuovi: [], soloRipasso: false });
  }
  if (giorni.length === 0) return giorni;

  const nRipasso = Math.min(2, Math.max(0, giorni.length - 1));
  for (let i = giorni.length - nRipasso; i < giorni.length; i++) giorni[i].soloRipasso = true;
  const giorniNuovi = giorni.filter(function (g) { return !g.soloRipasso; });

  const daFare = CONTENUTI.filter(function (a) { return recArg(a.id).stato === 0; });
  const peso = function (a) { return (a.area === "C" || a.area === "D") ? 2 : 1; };
  const pesoTot = daFare.reduce(function (s, a) { return s + peso(a); }, 0);

  if (giorniNuovi.length > 0 && daFare.length > 0) {
    const quota = pesoTot / giorniNuovi.length;
    let idx = 0, cumulo = 0;
    daFare.forEach(function (a) {
      if (cumulo >= quota * (idx + 1) && idx < giorniNuovi.length - 1) idx++;
      giorniNuovi[idx].nuovi.push(a);
      cumulo += peso(a);
    });
  } else if (daFare.length > 0) {
    daFare.forEach(function (a) { giorni[0].nuovi.push(a); });
  }

  giorni.forEach(function (g, i) {
    const iso = dataISO(g.data);
    g.ripassi = CONTENUTI.filter(function (a) {
      const r = stato.argomenti[a.id];
      if (!r || r.stato === 0 || !r.prossimoRipasso) return false;
      return (i === 0) ? (r.prossimoRipasso <= iso) : (r.prossimoRipasso === iso);
    });
    g.simulazioneFatta = (stato.simulazioni[iso] || 0) > 0;
  });
  return giorni;
}

// ============================================================
// Navigazione
// ============================================================
const VISTE = ["oggi", "argomenti", "simula", "quiz", "teoria", "flashcard", "dimostrazioni", "formulario"];
function mostraVista(nome) {
  chiudiScheda();
  VISTE.forEach(function (v) {
    document.getElementById("vista-" + v).classList.toggle("attiva", v === nome);
  });
  document.querySelectorAll("#navbar button").forEach(function (b) {
    b.classList.toggle("attivo", b.dataset.vista === nome);
  });
  if (nome === "oggi") renderOggi();
  if (nome === "argomenti") renderListaArgomenti();
  if (nome === "simula") renderSimulaIdle();
  if (nome === "quiz") renderQuizIdle();
  if (nome === "teoria") renderTeoriaIdle();
  if (nome === "flashcard") renderFlashcardIdle();
  if (nome === "dimostrazioni") renderDimostrazioniIdle();
  if (nome === "formulario") renderFormulario();
  window.scrollTo(0, 0);
}
document.querySelectorAll("#navbar button").forEach(function (b) {
  b.addEventListener("click", function () { mostraVista(b.dataset.vista); });
});

function tagArea(a) { return '<span class="tag tag-' + a + '">' + a + "</span>"; }
function pallino(id) { return '<span class="stato-pallino st-' + recArg(id).stato + '"></span>'; }

// ============================================================
// Anelli di progresso
// ============================================================
function anelloSVG(perc, nome, colore) {
  const r = 30, c = 2 * Math.PI * r, off = c * (1 - perc / 100);
  return '<div class="anello"><svg width="76" height="76" viewBox="0 0 76 76">' +
    '<circle class="traccia" cx="38" cy="38" r="' + r + '" stroke-width="7"></circle>' +
    '<circle class="valore" cx="38" cy="38" r="' + r + '" stroke-width="7" ' +
    'stroke="' + (colore || "var(--accent)") + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) + '" data-off="' + off.toFixed(1) + '"></circle>' +
    '</svg><div class="perc" data-target="' + perc + '">0%</div><div class="nome">' + nome + "</div></div>";
}
function contaSu(el, target, durata) {
  const ridotto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (ridotto || target <= 0) { el.textContent = target + "%"; return; }
  const t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / durata);
    const val = Math.round(target * (1 - Math.pow(1 - p, 3))); // ease-out cubica
    el.textContent = val + "%";
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
function animaAnelli(contenitore) {
  // Applica i valori finali (usato sia come animazione sia come fallback)
  function applica(anima) {
    contenitore.querySelectorAll(".anello .valore").forEach(function (c) {
      c.style.strokeDashoffset = c.dataset.off;
    });
    contenitore.querySelectorAll(".anello .perc").forEach(function (p) {
      const t = parseInt(p.dataset.target, 10) || 0;
      if (anima) contaSu(p, t, 900); else p.textContent = t + "%";
    });
    contenitore.querySelectorAll(".barra-totale span[data-w]").forEach(function (s) {
      s.style.width = s.dataset.w + "%";
    });
  }
  // Se la tab è nascosta i requestAnimationFrame sono sospesi: imposta subito i valori finali.
  if (document.hidden) { applica(false); return; }
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { applica(true); });
  });
}

// ============================================================
// Vista OGGI (dashboard + piano)
// ============================================================
function renderOggi() {
  const el = document.getElementById("vista-oggi");
  const gg = giorniAllEsame();
  let html = "<h2>Oggi</h2>";
  html += '<p class="mini" style="margin-top:-.4em">' + AMBITO + "</p>";

  const oggiIso = dataISO(oggiData());
  if (gg === null) {
    html += '<div class="avviso">📅 <b>Nessuna data d\'esame impostata.</b> Impostala per attivare il piano di studio giornaliero e il countdown.' +
      '<div style="margin-top:10px"><input type="date" id="input-data-esame" min="' + oggiIso + '" onchange="impostaDataEsame(this.value)" style="width:100%;background:var(--sup2,#1c212c);color:var(--fg,#e9edf4);border:none;border-radius:10px;padding:12px;font:inherit;min-height:46px"></div></div>';
  } else if (gg <= 0) {
    html += '<div class="avviso">🎓 <b>Oggi è il giorno dell\'esame!</b> In bocca al lupo. Ripassa il formulario e stai tranquillo: il lavoro l\'hai fatto. ' +
      '<button class="btn-fantasma" style="min-height:34px;padding:0 6px" onclick="impostaDataEsame(null)">Rimuovi data</button></div>';
  } else {
    html += '<div class="avviso">📅 Mancano <b>' + gg + " giorn" + (gg === 1 ? "o" : "i") + '</b> all\'esame (' + formattaData(dataEsame()) + '). ' +
      '<button class="btn-fantasma" style="min-height:34px;padding:0 6px" onclick="impostaDataEsame(null)">Rimuovi</button></div>';
  }

  // Barra di preparazione complessiva
  const puntiTot = CONTENUTI.reduce(function (s, a) { return s + recArg(a.id).stato; }, 0);
  const percTot = Math.round(100 * puntiTot / (3 * CONTENUTI.length));
  html += '<div class="card"><div class="quiz-meta" style="margin-bottom:2px"><span><b>Preparazione complessiva</b></span><span><b>' + percTot + '%</b></span></div>' +
    '<div class="barra-totale"><span data-w="' + percTot + '"></span></div></div>';

  // Anelli di copertura per area
  html += '<div class="card"><h3 style="margin-top:0">Copertura per area</h3><div class="anelli">';
  const coloriArea = { A: "#7db5ff", B: "#5fe0a0", C: "#ffc266", D: "#d3a8ff" };
  Object.keys(AREE).forEach(function (area) {
    const args = CONTENUTI.filter(function (a) { return a.area === area; });
    const punti = args.reduce(function (s, a) { return s + recArg(a.id).stato; }, 0);
    const perc = Math.round(100 * punti / (3 * args.length));
    html += anelloSVG(perc, "Area " + area, coloriArea[area]);
  });
  html += '</div><div class="legenda-stati">' +
    '<span><span class="stato-pallino st-0"></span>mai visto</span>' +
    '<span><span class="stato-pallino st-1"></span>debole</span>' +
    '<span><span class="stato-pallino st-2"></span>consolidato</span>' +
    '<span><span class="stato-pallino st-3"></span>padroneggiato</span></div></div>';

  // Da fare oggi
  const piano = costruiscePiano();
  const oggiP = piano[0];
  html += '<div class="card"><h3 style="margin-top:0">Da fare oggi</h3>';
  if (!oggiP) {
    html += '<p class="vuoto">' + (gg === null
      ? "Studio libero: nessuna scadenza. Apri gli argomenti, allena l'esposizione dal tab Simula o fai un quiz."
      : "Nessun piano: l'esame è oggi o è passato.") + "</p>";
  } else {
    if (oggiP.nuovi.length) {
      html += '<div class="etichetta-sez">Nuovi argomenti (' + oggiP.nuovi.length + ")</div>";
      oggiP.nuovi.forEach(function (a) {
        html += '<button class="chip-arg bordo-st-' + recArg(a.id).stato + '" onclick="apriScheda(' + a.id + ')">' + pallino(a.id) + tagArea(a.area) + a.titolo + "</button>";
      });
    }
    if (oggiP.ripassi.length) {
      html += '<div class="etichetta-sez">Ripassi dovuti (' + oggiP.ripassi.length + ")</div>";
      oggiP.ripassi.forEach(function (a) {
        html += '<button class="chip-arg bordo-st-' + recArg(a.id).stato + '" onclick="apriScheda(' + a.id + ')">' + pallino(a.id) + tagArea(a.area) + a.titolo + "</button>";
      });
    }
    if (!oggiP.nuovi.length && !oggiP.ripassi.length) {
      html += '<p class="vuoto">Nessun nuovo argomento né ripasso in scadenza. 👏</p>';
    }
    html += '<div class="etichetta-sez">Simulazione obbligatoria</div>';
    html += oggiP.simulazioneFatta
      ? '<p>✅ Simulazione di oggi completata (' + (stato.simulazioni[dataISO(oggiData())] || 0) + ")</p>"
      : '<button class="btn-primario btn-largo" onclick="mostraVista(\'simula\')">🎤 Fai la simulazione di oggi</button>';
  }
  html += "</div>";

  // Piano completo
  if (piano.length > 1) {
    html += '<h3>Piano fino all\'esame</h3><p class="mini">Quello che non completi slitta automaticamente sui giorni successivi. Peso doppio sulle aree C e D; ultimi ' +
      Math.min(2, piano.length - 1) + ' giorni solo ripasso e simulazioni.</p>';
    piano.forEach(function (g, i) {
      if (i === 0) return; // il giorno corrente è già sopra
      html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>' + formattaData(g.data) + "</b>" +
        (g.soloRipasso ? '<span class="tag">solo ripasso</span>' : "") + "</div>";
      if (g.nuovi.length) {
        html += '<div class="etichetta-sez">Nuovi</div>';
        g.nuovi.forEach(function (a) {
          html += '<button class="chip-arg bordo-st-0" onclick="apriScheda(' + a.id + ')">' + pallino(a.id) + tagArea(a.area) + a.titolo + "</button>";
        });
      }
      if (g.ripassi && g.ripassi.length) {
        html += '<div class="etichetta-sez">Ripassi programmati</div>';
        g.ripassi.forEach(function (a) {
          html += '<button class="chip-arg bordo-st-' + recArg(a.id).stato + '" onclick="apriScheda(' + a.id + ')">' + pallino(a.id) + tagArea(a.area) + a.titolo + "</button>";
        });
      }
      if (g.soloRipasso && !(g.ripassi && g.ripassi.length) && !g.nuovi.length) {
        html += '<p class="vuoto">Ripasso libero dei più deboli + simulazioni.</p>';
      }
      html += '<div class="mini" style="margin-top:8px">🎤 1 simulazione obbligatoria</div></div>';
    });
  }
  el.innerHTML = html;
  animaAnelli(el);
}

// ============================================================
// Vista ARGOMENTI (lista) + scheda a schermo intero
// ============================================================
function renderListaArgomenti() {
  const el = document.getElementById("vista-argomenti");
  let html = "<h2>I 33 argomenti</h2>";
  Object.keys(AREE).forEach(function (area) {
    html += "<h3>" + tagArea(area) + AREE[area] + '</h3><ul class="lista-argomenti stagger">';
    CONTENUTI.filter(function (a) { return a.area === area; }).forEach(function (a) {
      html += '<li><button class="riga-argomento bordo-st-' + recArg(a.id).stato + '" onclick="apriScheda(' + a.id + ')">' +
        pallino(a.id) + '<span class="titolo-arg">' + a.id + ". " + a.titolo + '</span><span class="mini">' +
        STATI[recArg(a.id).stato] + '</span><span class="freccia">›</span></button></li>';
    });
    html += "</ul>";
  });
  el.innerHTML = html;
}

function sezione(titolo, corpoHtml, aperta, attr) {
  return '<details class="sezione"' + (aperta ? " open" : "") + (attr ? " " + attr : "") + "><summary>" + titolo + '</summary><div class="corpo">' + corpoHtml + "</div></details>";
}
function listaPunti(arr) {
  return '<ul class="puntata">' + arr.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
}

let simCleanup = null;

function apriScheda(id) {
  const a = CONTENUTI.find(function (x) { return x.id === id; });
  if (!a) return;
  if (simCleanup) { simCleanup(); simCleanup = null; }
  const overlay = document.getElementById("scheda-overlay");
  const el = document.getElementById("scheda-contenuto");
  const r = recArg(id);
  const prereq = a.prerequisiti.map(function (pid) {
    const p = CONTENUTI.find(function (x) { return x.id === pid; });
    return p ? '<button class="tag" onclick="apriScheda(' + pid + ')">' + p.titolo + "</button>" : "";
  }).join(" ");

  const deriv = a.derivazione.map(function (p, i) {
    return '<div class="passo-derivazione"><div class="p-passo">' + (i + 1) + ". " + p.passo +
      '</div><div class="p-formula">' + p.formula + '</div><div class="p-commento">' + p.commento + "</div></div>";
  }).join("");

  let html = '<div class="barra-scheda"><button class="btn-fantasma" onclick="chiudiScheda()">‹ Indietro</button>' +
    '<span style="flex:1"></span>' + tagArea(a.area) + '<span class="stato-pallino st-' + r.stato + '"></span></div>' +
    '<div class="titolo-scheda">' + a.id + ". " + a.titolo + "</div>" +
    '<p class="mini">' + AREE[a.area] + " · Stato: <b>" + STATI[r.stato] + "</b>" +
    (r.prossimoRipasso ? " · prossimo ripasso: " + r.prossimoRipasso : "") + "</p>" +
    (prereq ? '<p class="mini">Prerequisiti: ' + prereq + "</p>" : "") +
    '<div class="spiegazione-hero"><h4>💡 L\'idea in sintesi</h4><p>' + a.intuizioneFisica + "</p></div>" +
    sezione("📖 Definizioni", "<p>" + a.definizioni + "</p>", true) +
    sezione("🧮 Derivazione (nascosta: prova prima a voce!)", deriv, false) +
    (typeof SIMS !== "undefined" && SIMS[a.id] ? sezione("🎬 Vedi in azione", '<div class="sim-box" id="sim-box"></div>', false, 'id="sim-det"') : "") +
    sezione("📌 Ipotesi di validità", "<p>" + a.ipotesi + "</p>", false) +
    sezione("🔭 Casi limite", "<p>" + a.casiLimite + "</p>", false) +
    sezione("⚠️ Errori tipici", listaPunti(a.erroriTipici), false) +
    sezione("✅ Checklist per l'orale", listaPunti(a.checklistOrale), false) +
    sezione("❓ Domande di approfondimento", listaPunti(a.domandeApprofondimento), false) +
    sezione("∑ Formule chiave", a.formuleChiave.map(function (f) { return '<div class="formula-riga">' + f + "</div>"; }).join(""), false) +
    '<div class="card no-print"><h3 style="margin-top:0">Autovalutazione rapida</h3><p class="mini">Dopo aver ripassato, come lo sapevi? Aggiorna lo stato e programma il ripasso.</p>' +
    '<div class="griglia-stati">' +
    [0, 1, 2, 3].map(function (q) {
      return "<button onclick=\"autovaluta(" + id + "," + q + ')">' + ["😵 Zero", "😕 Poco", "🙂 Bene", "😎 Perfetto"][q] + "</button>";
    }).join("") + "</div></div>";

  el.innerHTML = html;
  overlay.scrollTop = 0;
  overlay.classList.add("aperta");
  const det = document.getElementById("sim-det");
  if (det) {
    det.addEventListener("toggle", function () {
      if (det.open && !simCleanup) {
        simCleanup = SIMS[a.id](document.getElementById("sim-box"));
      } else if (!det.open && simCleanup) {
        simCleanup(); simCleanup = null;
      }
    });
  }
  typeset(el);
}
// Ridisegna la vista attualmente attiva (dopo che uno stato è cambiato)
function rerenderVistaAttiva() {
  const attiva = document.querySelector(".vista.attiva");
  if (!attiva) return;
  if (attiva.id === "vista-oggi") renderOggi();
  else if (attiva.id === "vista-argomenti") renderListaArgomenti();
  else if (attiva.id === "vista-formulario" && typeof renderFormulario === "function") renderFormulario();
}
function chiudiScheda() {
  if (simCleanup) { simCleanup(); simCleanup = null; }
  const overlay = document.getElementById("scheda-overlay");
  if (overlay.classList.contains("aperta")) {
    overlay.classList.remove("aperta");
    // aggiorna la vista sottostante (stati/pallini possono essere cambiati)
    rerenderVistaAttiva();
  }
}
function autovaluta(id, q) {
  registraRevisione(id, q);
  apriScheda(id);        // riapre la scheda aggiornata (stato/prossimo ripasso)
  rerenderVistaAttiva(); // e aggiorna la dashboard/lista sotto l'overlay
}

// ============================================================
// Vista SIMULA (simulazione d'orale)
// ============================================================
let sim = null;

function scegliArgomentoPesato() {
  const oggiIso = dataISO(oggiData());
  const pesi = CONTENUTI.map(function (a) {
    const r = recArg(a.id);
    let w = 4 - r.stato;
    if (r.prossimoRipasso && r.prossimoRipasso <= oggiIso && r.stato > 0) w += 2;
    if (a.area === "C" || a.area === "D") w += 1;
    return w;
  });
  const tot = pesi.reduce(function (s, w) { return s + w; }, 0);
  let x = Math.random() * tot;
  for (let i = 0; i < CONTENUTI.length; i++) {
    x -= pesi[i];
    if (x <= 0) return CONTENUTI[i];
  }
  return CONTENUTI[CONTENUTI.length - 1];
}

function fermaTimer() { if (sim && sim.timerId) { clearInterval(sim.timerId); sim.timerId = null; } }

function modalitaSim() {
  if (stato.modalitaSim !== "facile" && stato.modalitaSim !== "difficile") stato.modalitaSim = "difficile";
  return stato.modalitaSim;
}
function impostaModalitaSim(m) {
  stato.modalitaSim = m; salvaStato();
  if (sim && sim.inizio) {           // simulazione in corso: aggiorna al volo, timer intatto
    sim.mode = m;
    aggiornaSegmentatoSim();
    renderChecklistSimBox();
  } else {
    renderSimulaIdle();
  }
}
function aggiornaSegmentatoSim() {
  const cont = document.getElementById("sim-modalita");
  if (!cont) return;
  const m = modalitaSim(), btns = cont.querySelectorAll("button");

// ============================================================
// Vista QUIZ (crea quiz per allenarti sugli argomenti)
// ============================================================
let quiz = null;
const QUIZ_TIPI = {
  formulaArg: "🧮 Formula → argomento",
  argFormula: "🧮 Argomento → formula",
  errore: "🧠 Riconosci l'errore",
  flash: "🧠 Flashcard a voce"
};
// Ambito di ciascun tipo di quiz: "pratica" (formule) o "teoria" (concetti)
const QUIZ_AMBITO = {
  formulaArg: "pratica", argFormula: "pratica", errore: "teoria", flash: "teoria"
};

function prefQuiz() {
  if (!stato.quizPref) stato.quizPref = { aree: ["A", "B", "C", "D"], n: 10, tipi: ["formulaArg", "argFormula", "errore", "flash"] };
  return stato.quizPref;
}
function mescola(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pescaDistrattori(pool, escludi, n) {
  const visti = new Set(escludi);
  const out = [];
  mescola(pool).forEach(function (x) {
    if (out.length >= n || visti.has(x)) return;
    visti.add(x); out.push(x);
  });
  return out;
}

// ---- Generatori di domande (dai dati dei 33 argomenti) ----
function domFormulaArg(a, argomenti) {
  if (!a.formuleChiave || !a.formuleChiave.length) return null;
  const f = a.formuleChiave[Math.floor(Math.random() * a.formuleChiave.length)];
  const altri = argomenti.filter(function (x) { return x.id !== a.id; });
  const stessaArea = mescola(altri.filter(function (x) { return x.area === a.area; })).map(function (x) { return x.titolo; });
  const altreAree = mescola(altri.filter(function (x) { return x.area !== a.area; })).map(function (x) { return x.titolo; });
  const distr = pescaDistrattori(stessaArea.concat(altreAree), [a.titolo], 3);
  if (distr.length < 2) return null;
  const opz = mescola([{ html: a.titolo, giusta: true }].concat(distr.map(function (t) { return { html: t, giusta: false }; })));
  return { tipo: "formulaArg", arg: a, testo: "A quale argomento appartiene questa formula chiave?", formula: f, opzioni: opz };
}
function domArgFormula(a, argomenti) {
  if (!a.formuleChiave || !a.formuleChiave.length) return null;
  const giusta = a.formuleChiave[Math.floor(Math.random() * a.formuleChiave.length)];
  const mieSet = new Set(a.formuleChiave);
  const poolStessa = [], poolAltre = [];
  argomenti.forEach(function (x) {
    if (x.id === a.id) return;
    (x.formuleChiave || []).forEach(function (f) {
      if (mieSet.has(f)) return;
      (x.area === a.area ? poolStessa : poolAltre).push(f);
    });
  });
  const distr = pescaDistrattori(mescola(poolStessa).concat(mescola(poolAltre)), mieSet, 3);
  if (distr.length < 2) return null;
  const opz = mescola([{ html: giusta, giusta: true }].concat(distr.map(function (f) { return { html: f, giusta: false }; })));
  return { tipo: "argFormula", arg: a, testo: "Quale di queste è una formula chiave di «" + a.titolo + "»?", opzioni: opz };
}
function domErrore(a, argomenti) {
  if (!a.erroriTipici || !a.erroriTipici.length) return null;
  const giusta = a.erroriTipici[Math.floor(Math.random() * a.erroriTipici.length)];
  const mieSet = new Set(a.erroriTipici);
  const poolStessa = [], poolAltre = [];
  argomenti.forEach(function (x) {
    if (x.id === a.id) return;
    (x.erroriTipici || []).forEach(function (e) {
      if (mieSet.has(e)) return;
      (x.area === a.area ? poolStessa : poolAltre).push(e);
    });
  });
  const distr = pescaDistrattori(mescola(poolStessa).concat(mescola(poolAltre)), mieSet, 3);
  if (distr.length < 2) return null;
  const opz = mescola([{ html: giusta, giusta: true }].concat(distr.map(function (e) { return { html: e, giusta: false }; })));
  return { tipo: "errore", arg: a, testo: "Quale di queste affermazioni è un errore tipico proprio di «" + a.titolo + "»?", opzioni: opz };
}
function domFlash(a) {
  const dom = a.domandeApprofondimento || [];
  if (!dom.length) return null;
  const q = dom[Math.floor(Math.random() * dom.length)];
  const m = q.match(/^(.*?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/);
  let domanda = q, risposta = null;
  if (m && /[a-zA-Zàèéìòù]/.test(m[2]) && m[1].trim().length > 0) {
    domanda = m[1].trim(); risposta = m[2].trim();
  }
  return { tipo: "flash", arg: a, testo: domanda, risposta: risposta };
}
