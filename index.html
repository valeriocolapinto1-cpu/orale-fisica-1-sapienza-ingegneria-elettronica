// ---- Costruzione ed esecuzione del quiz ----
function avviaQuiz() {
  const p = prefQuiz();
  const nEl = document.getElementById("quiz-n");
  if (nEl) p.n = parseInt(nEl.value, 10) || 10;
  salvaStato();
  const argomenti = CONTENUTI.filter(function (a) { return p.aree.indexOf(a.area) >= 0; });
  const generatori = { formulaArg: domFormulaArg, argFormula: domArgFormula, errore: domErrore, flash: domFlash };
  const domande = [], chiaviViste = new Set();
  let tentativi = 0;
  while (domande.length < p.n && tentativi < p.n * 50) {
    tentativi++;
    const tipo = p.tipi[Math.floor(Math.random() * p.tipi.length)];
    const a = argomenti[Math.floor(Math.random() * argomenti.length)];
    const d = generatori[tipo](a, argomenti);
    if (!d) continue;
    const chiave = tipo + "|" + a.id + "|" + (d.formula || d.testo || "");
    if (chiaviViste.has(chiave)) continue;
    chiaviViste.add(chiave);
    domande.push(d);
  }
  if (!domande.length) { renderQuizIdle(); return; }
  quiz = { domande: domande, i: 0, giuste: 0, risposte: [], vista: "quiz", origine: "quiz" };
  mostraDomandaQuiz();
}
// il motore quiz è condiviso tra la vista "Quiz" e la vista "Teoria"
function quizVistaEl() { return document.getElementById("vista-" + ((quiz && quiz.vista) || "quiz")); }
function esciQuiz() { if (quiz && quiz.origine === "teoria") renderTeoriaIdle(); else renderQuizIdle(); }
function rigeneraQuiz() { if (quiz && quiz.origine === "teoria") avviaTeoria(); else avviaQuiz(); }
function mostraDomandaQuiz() {
  const el = quizVistaEl();
  const q = quiz.domande[quiz.i], n = quiz.domande.length;
  const perc = Math.round(100 * quiz.i / n);
  // se la domanda rivela il tema con le opzioni, nascondo l'area (niente spoiler)
  const tag = (q.tipo === "formulaArg" || q.nascondiArea) ? "" : tagArea(q.arg.area);
  const etichetta = q.etichetta || QUIZ_TIPI[q.tipo] || "";
  let html = '<div class="quiz-meta"><span>Domanda ' + (quiz.i + 1) + " / " + n + '</span><span>✅ ' + quiz.giuste + "</span></div>" +
    '<div class="quiz-barra"><span style="width:' + perc + '%"></span></div>' +
    '<div class="card"><div class="quiz-tipo-tag">' + tag + etichetta + "</div>" +
    '<div class="quiz-domanda">' + q.testo + "</div>";
  if (q.formula) html += '<div class="p-formula" style="font-size:1.15rem;margin:6px 0">' + q.formula + "</div>";
  if (q.contesto) html += '<div class="quiz-contesto">' + q.contesto + "</div>";
  if (q.tipo === "flash") {
    html += '<div id="quiz-flash-area"><button class="btn-primario btn-largo" onclick="rivelaFlash()">👁 Mostra la risposta</button></div>';
  } else {
    html += '<div class="quiz-opzioni" id="quiz-opzioni">';
    q.opzioni.forEach(function (o, idx) {
      html += '<button class="quiz-opt" onclick="rispondiQuiz(' + idx + ')"><span class="lettera">' + "ABCD"[idx] + "</span><span>" + o.html + "</span></button>";
    });
    html += "</div>";
  }
  html += '</div><div id="quiz-azioni"></div>' +
    '<button class="btn-largo btn-fantasma" onclick="esciQuiz()">Esci</button>';
  el.innerHTML = html;
  window.scrollTo(0, 0);
  typeset(el);
}
function rispondiQuiz(idx) {
  const q = quiz.domande[quiz.i];
  if (q.risolta) return;
  q.risolta = true;
  const corretta = q.opzioni[idx].giusta;
  if (corretta) quiz.giuste++;
  quiz.risposte.push({ arg: q.arg, corretta: corretta });
  const cont = document.getElementById("quiz-opzioni");
  Array.prototype.forEach.call(cont.children, function (b, j) {
    b.disabled = true;
    if (q.opzioni[j].giusta) b.classList.add("giusta");
    else if (j === idx) b.classList.add("sbagliata");
    else b.classList.add("attenua");
  });
  const az = document.getElementById("quiz-azioni");
  az.innerHTML = '<div class="quiz-esito ' + (corretta ? "ok" : "no") + '">' +
    (corretta ? "✅ Giusto!" : "❌ Non ci siamo: la risposta corretta è evidenziata in verde.") + "</div>";
  aggiungiAvantiQuiz();
}
function rivelaFlash() {
  const q = quiz.domande[quiz.i];
  const area = document.getElementById("quiz-flash-area");
  let html = q.risposta
    ? '<div class="quiz-flash-risposta"><span class="mini">Risposta / traccia</span>' + q.risposta + "</div>"
    : '<div class="quiz-flash-risposta"><span class="mini">Domanda aperta</span>Esponi la risposta a voce come faresti all\'orale, poi valuta come è andata.</div>';
  html += '<p class="mini" style="margin-top:10px">Come è andata?</p><div class="segmentato pieno">' +
    '<button onclick="valutaFlash(false)">❌ Non la sapevo</button>' +
    '<button onclick="valutaFlash(true)">✅ La sapevo</button></div>';
  area.innerHTML = html;
  typeset(area);
}
function valutaFlash(ok) {
  const q = quiz.domande[quiz.i];
  if (q.risolta) return;
  q.risolta = true;
  if (ok) quiz.giuste++;
  quiz.risposte.push({ arg: q.arg, corretta: ok });
  const btns = document.querySelectorAll("#quiz-flash-area .segmentato button");
  btns.forEach(function (b, j) { b.disabled = true; });
  if (btns[ok ? 1 : 0]) btns[ok ? 1 : 0].classList.add("sel"); // 0 = "Non la sapevo", 1 = "La sapevo"
  aggiungiAvantiQuiz();
}
function aggiungiAvantiQuiz() {
  const az = document.getElementById("quiz-azioni");
  const ultima = quiz.i >= quiz.domande.length - 1;
  const btn = document.createElement("button");
  btn.className = "btn-primario btn-largo";
  btn.textContent = ultima ? "🏁 Vedi i risultati" : "Prossima domanda →";
  btn.onclick = prossimaQuiz;
  az.appendChild(btn);
  btn.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function prossimaQuiz() {
  if (quiz.i >= quiz.domande.length - 1) { risultatiQuiz(); return; }
  quiz.i++;
  mostraDomandaQuiz();
}
function risultatiQuiz() {
  const n = quiz.domande.length;
  const perc = Math.round(100 * quiz.giuste / n);
  const statKey = (quiz.origine === "teoria") ? "teoriaStat" : "quizStat";
  stato[statKey] = stato[statKey] || { fatti: 0, migliore: 0 };
  stato[statKey].fatti++;
  const record = perc > stato[statKey].migliore;
  if (record) stato[statKey].migliore = perc;
  salvaStato();
  const sbagliati = [], visti = {};
  quiz.risposte.forEach(function (r) {
    if (!r.corretta && !visti[r.arg.id]) { visti[r.arg.id] = true; sbagliati.push(r.arg); }
  });
  quiz.sbagliatiIds = sbagliati.map(function (a) { return a.id; });
  const badge = perc >= 80 ? { t: "Ottimo! 🎉", c: "var(--st3-soft)", cc: "#8ef0bb" }
    : perc >= 50 ? { t: "Ci sei quasi 💪", c: "var(--st2-soft)", cc: "#ffce7a" }
      : { t: "Da ripassare 📚", c: "var(--st1-soft)", cc: "#ff9d9d" };
  const el = quizVistaEl();
  let html = "<h2>" + (quiz.origine === "teoria" ? "Risultato — Teoria" : "Risultato del quiz") + "</h2>" +
    '<div class="card" style="text-align:center">' +
    '<div class="quiz-punteggio">' + quiz.giuste + " / " + n + "</div>" +
    '<div class="quiz-badge" style="background:' + badge.c + ";color:" + badge.cc + '">' + perc + "% · " + badge.t + "</div>" +
    (record && stato[statKey].fatti > 1 ? '<p class="mini">🏅 Nuovo record personale!</p>' : "") + "</div>";

  // dettaglio per area
  const perArea = {};
  quiz.risposte.forEach(function (r) {
    const A = r.arg.area;
    if (!perArea[A]) perArea[A] = { tot: 0, ok: 0 };
    perArea[A].tot++; if (r.corretta) perArea[A].ok++;
  });
  const chiaviArea = Object.keys(perArea);
  if (chiaviArea.length) {
    html += '<div class="card"><h3 style="margin-top:0">Come sei andato per area</h3>';
    chiaviArea.forEach(function (A) {
      const d = perArea[A], pc = Math.round(100 * d.ok / d.tot);
      html += '<div style="margin-bottom:10px"><div class="quiz-meta" style="margin-bottom:4px">' +
        "<span>" + tagArea(A) + AREE[A] + "</span><span>" + d.ok + "/" + d.tot + "</span></div>" +
        '<div class="quiz-barra"><span style="width:' + pc + '%"></span></div></div>';
    });
    html += "</div>";
  }

  // argomenti sbagliati
  if (sbagliati.length) {
    html += '<div class="card"><h3 style="margin-top:0">Da rivedere (' + sbagliati.length + ")</h3>";
    sbagliati.forEach(function (a) {
      html += '<button class="chip-arg bordo-st-' + recArg(a.id).stato + '" onclick="apriScheda(' + a.id + ')">' + pallino(a.id) + tagArea(a.area) + a.titolo + "</button>";
    });
    html += '<button class="btn-largo" style="margin-top:10px" onclick="marcaDaRipassare()">📌 Segna questi argomenti come «da ripassare»</button></div>';
  } else {
    html += '<div class="avviso">🌟 Nessun errore: hai risposto correttamente a tutto!</div>';
  }

  html += '<button class="btn-primario btn-largo" onclick="rigeneraQuiz()">🔁 Nuova serie (stesse impostazioni)</button>' +
    '<button class="btn-largo btn-fantasma" onclick="esciQuiz()">⚙️ Cambia impostazioni</button>';
  el.innerHTML = html;
  window.scrollTo(0, 0);
  typeset(el);
}
function marcaDaRipassare() {
  if (!quiz || !quiz.sbagliatiIds) return;
  quiz.sbagliatiIds.forEach(function (id) { registraRevisione(id, 1); });
  const el = quizVistaEl();
  const av = document.createElement("div");
  av.className = "avviso";
  av.innerHTML = "✅ " + quiz.sbagliatiIds.length + " argoment" + (quiz.sbagliatiIds.length === 1 ? "o segnato" : "i segnati") +
    " come deboli: li ritroverai nel piano di oggi e con priorità nelle simulazioni.";
  el.insertBefore(av, el.firstChild);
  window.scrollTo(0, 0);
}

// ============================================================
// Vista TEORIA (quiz teorico a difficoltà variabile, generato al momento)
// ============================================================
const DIFF_ETICHETTA = { 1: "Facile", 2: "Medio", 3: "Difficile" };
function prefTeoria() {
  if (!stato.teoriaPref) stato.teoriaPref = { aree: ["A", "B", "C", "D"], n: 10, diff: 2 };
  return stato.teoriaPref;
}
// distrattori (titoli) scelti in base alla difficoltà: facile = aree diverse, difficile = stessa area
function distrattoriTitoli(a, argomenti, diff, n) {
  const altri = argomenti.filter(function (x) { return x.id !== a.id; });
  const same = mescola(altri.filter(function (x) { return x.area === a.area; })).map(function (x) { return x.titolo; });
  const cross = mescola(altri.filter(function (x) { return x.area !== a.area; })).map(function (x) { return x.titolo; });
  let pool;
  if (diff >= 3) pool = same.concat(cross);
  else if (diff === 2) pool = mescola(same.slice(0, 2).concat(cross));
  else pool = cross.concat(same);
  return pescaDistrattori(pool, [a.titolo], n);
}
function opzioniTitoli(a, distr) {
  return mescola([{ html: a.titolo, giusta: true }].concat(distr.map(function (t) { return { html: t, giusta: false }; })));
}
function mascheraTitolo(testo, a) {
  let out = testo;
  const parole = a.titolo.toLowerCase().replace(/[^\wàèéìòù\s]/gi, " ").split(/\s+/).filter(function (w) { return w.length > 4; });
  parole.forEach(function (w) {
    try {
      const re = new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-zà-ù]*", "gi");
      out = out.replace(re, "…");
    } catch (e) { }
  });
  return out;
}
function primaFrase(testo) {
  const m = testo.match(/^[^.]*\.(?:\s|$)/);
  return m ? m[0].trim() : testo;
}
function tDomIntuizione(a, argomenti, diff) {
  if (!a.intuizioneFisica) return null;
  const distr = distrattoriTitoli(a, argomenti, diff, diff >= 2 ? 3 : 2);
  if (distr.length < 2) return null;
  return { tipo: "teoria", arg: a, testo: "Quale argomento descrive questa idea?", contesto: a.intuizioneFisica, opzioni: opzioniTitoli(a, distr), nascondiArea: true, etichetta: "IDEA → ARGOMENTO · " + DIFF_ETICHETTA[diff] };
}
function tDomPunto(a, argomenti, diff) {
  if (!a.checklistOrale || !a.checklistOrale.length) return null;
  const punto = a.checklistOrale[Math.floor(Math.random() * a.checklistOrale.length)];
  const distr = distrattoriTitoli(a, argomenti, diff, diff >= 2 ? 3 : 2);
  if (distr.length < 2) return null;
  return { tipo: "teoria", arg: a, testo: "In quale trattazione rientra questo passaggio?", contesto: punto, opzioni: opzioniTitoli(a, distr), nascondiArea: true, etichetta: "PASSAGGIO → ARGOMENTO · " + DIFF_ETICHETTA[diff] };
}
function tDomDefinizione(a, argomenti, diff) {
  if (!a.definizioni) return null;
  const distr = distrattoriTitoli(a, argomenti, diff, diff >= 2 ? 3 : 2);
  if (distr.length < 2) return null;
  return { tipo: "teoria", arg: a, testo: "Di quale argomento è questa definizione?", contesto: mascheraTitolo(primaFrase(a.definizioni), a), opzioni: opzioniTitoli(a, distr), nascondiArea: true, etichetta: "DEFINIZIONE → ARGOMENTO · " + DIFF_ETICHETTA[diff] };
}
function segmentatoDiff(diff) {
  return '<div class="segmentato pieno" id="teoria-diff">' +
    [1, 2, 3].map(function (d) {
      return '<button class="' + (diff === d ? "sel" : "") + '" onclick="impostaTeoriaDiff(' + d + ')">' + ["🟢 Facile", "🟡 Medio", "🔴 Difficile"][d - 1] + "</button>";
    }).join("") + "</div>";
}
function descrizioneDiff(diff) {
  return diff === 1 ? "Distrattori da aree diverse e 3 opzioni: si riconosce bene il tema."
    : diff === 2 ? "4 opzioni con distrattori misti: serve conoscere l'argomento."
      : "4 opzioni con distrattori dalla <b>stessa area</b>: distinzioni sottili.";
}
function impostaTeoriaDiff(d) {
  const p = prefTeoria(); p.diff = d; salvaStato();
  const cont = document.getElementById("teoria-diff");
  if (cont) cont.querySelectorAll("button").forEach(function (b, i) { b.classList.toggle("sel", i === d - 1); });
  const desc = cont && cont.parentNode ? cont.parentNode.querySelector(".mini") : null;
  if (desc) desc.innerHTML = descrizioneDiff(d);
}
function toggleTeoriaArea(area) {
  const p = prefTeoria(), i = p.aree.indexOf(area);
  if (i >= 0) { if (p.aree.length > 1) p.aree.splice(i, 1); } else p.aree.push(area);
  salvaStato(); aggiornaChip("teoria-aree", "area", p.aree);
}
function renderTeoriaIdle() {
  quiz = null;
  const el = document.getElementById("vista-teoria");
  const p = prefTeoria();
  const st = stato.teoriaStat || { fatti: 0, migliore: 0 };
  let html = "<h2>Quiz di teoria</h2>" +
    '<p class="mini" style="margin-top:-.4em">' + AMBITO + " · 🧠 Teoria (concetti, niente formule)</p>" +
    '<p class="mini">Domande concettuali generate al momento dai contenuti dei 33 argomenti: riconosci l\'argomento dall\'idea, da un passaggio della trattazione o dalla definizione. Niente formule, solo teoria.</p>';
  html += '<div class="card"><h3 style="margin-top:0">1 · Difficoltà</h3>' + segmentatoDiff(p.diff) +
    '<p class="mini" style="margin-top:8px">' + descrizioneDiff(p.diff) + "</p></div>";
  html += '<div class="card"><h3 style="margin-top:0">2 · Aree</h3><div class="quiz-scelte" id="teoria-aree">';
  Object.keys(AREE).forEach(function (area) {
    const sel = p.aree.indexOf(area) >= 0;
    html += '<button class="chip-scelta' + (sel ? " sel" : "") + '" data-area="' + area + '" onclick="toggleTeoriaArea(\'' + area + '\')">' + tagArea(area) + AREE[area] + "</button>";
  });
  html += "</div></div>";
  html += '<div class="card"><h3 style="margin-top:0">3 · Quante domande?</h3>' +
    '<div class="sim-riga"><label>Numero</label><input type="range" id="teoria-n" min="5" max="25" step="1" value="' + p.n +
    '" oninput="document.getElementById(\'teoria-n-out\').textContent=this.value"><output id="teoria-n-out">' + p.n + "</output></div></div>";
  if (st.fatti > 0) html += '<p class="mini">Quiz di teoria completati: ' + st.fatti + " · miglior punteggio: " + st.migliore + "%</p>";
  html += '<button class="btn-primario btn-largo" onclick="avviaTeoria()">🧠 Genera il quiz di teoria</button>';
  el.innerHTML = html;
  typeset(el);
}
function avviaTeoria() {
  const p = prefTeoria();
  const nEl = document.getElementById("teoria-n");
  if (nEl) p.n = parseInt(nEl.value, 10) || 10;
  salvaStato();
  const argomenti = CONTENUTI.filter(function (a) { return p.aree.indexOf(a.area) >= 0; });
  const gen = (p.diff === 1) ? [tDomIntuizione, tDomDefinizione]
    : (p.diff === 2) ? [tDomIntuizione, tDomPunto, tDomDefinizione]
      : [tDomPunto, tDomIntuizione, tDomDefinizione];
  const domande = [], viste = new Set();
  let tent = 0;
  while (domande.length < p.n && tent < p.n * 60) {
    tent++;
    const g = gen[Math.floor(Math.random() * gen.length)];
    const a = argomenti[Math.floor(Math.random() * argomenti.length)];
    const d = g(a, argomenti, p.diff);
    if (!d) continue;
    const chiave = d.etichetta + "|" + a.id + "|" + (d.contesto || "").slice(0, 24);
    if (viste.has(chiave)) continue;
    viste.add(chiave);
    domande.push(d);
  }
  if (!domande.length) { renderTeoriaIdle(); return; }
  quiz = { domande: domande, i: 0, giuste: 0, risposte: [], vista: "teoria", origine: "teoria" };
  mostraDomandaQuiz();
}

// ============================================================
// Vista FLASHCARD (un mazzo per ogni argomento, flip 3D)
// ============================================================
let flash = null;
function costruisciMazzo(a) {
  const carte = [];
  const lista = function (arr) { return "<ul>" + arr.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>"; };
  if (a.intuizioneFisica) carte.push({ d: "L'idea in sintesi", r: a.intuizioneFisica, tag: "Intuizione" });
  if (a.definizioni) carte.push({ d: "Definizione di « " + a.titolo + " »", r: a.definizioni, tag: "Definizione" });
  if (a.formuleChiave && a.formuleChiave.length) carte.push({ d: "Le formule chiave", r: lista(a.formuleChiave), tag: "Formule" });
  if (a.ipotesi) carte.push({ d: "Ipotesi di validità", r: a.ipotesi, tag: "Ipotesi" });
  if (a.casiLimite) carte.push({ d: "Casi limite", r: a.casiLimite, tag: "Casi limite" });
  (a.domandeApprofondimento || []).forEach(function (q) {
    const m = q.match(/^(.*?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/);
    if (m && /[a-zA-Zàèéìòù]/.test(m[2]) && m[1].trim().length > 0) carte.push({ d: m[1].trim(), r: m[2].trim(), tag: "Approfondimento" });
    else carte.push({ d: q, r: "Domanda aperta: prova a esporre la risposta a voce, come all'orale.", tag: "Approfondimento" });
  });
  if (a.erroriTipici && a.erroriTipici.length) carte.push({ d: "Errori da evitare", r: lista(a.erroriTipici), tag: "Errori tipici" });
  if (a.checklistOrale && a.checklistOrale.length) carte.push({ d: "Cosa dire all'orale", r: lista(a.checklistOrale), tag: "Checklist" });
  return carte;
}
function renderFlashcardIdle() {
  flash = null;
  const el = document.getElementById("vista-flashcard");
  let html = "<h2>Flashcard</h2>" +
    '<p class="mini">Un mazzo di flashcard per ogni argomento — idea, definizione, formule, ipotesi, casi limite, errori, domande e checklist. Tocca la carta per girarla.</p>' +
    '<button class="btn-primario btn-largo" onclick="apriMazzoMescolato()" style="margin-bottom:8px">🎲 Mazzo misto (tutti gli argomenti)</button>';
  Object.keys(AREE).forEach(function (area) {
    html += "<h3>" + tagArea(area) + AREE[area] + '</h3><ul class="lista-argomenti stagger">';
    CONTENUTI.filter(function (a) { return a.area === area; }).forEach(function (a) {
      const nc = costruisciMazzo(a).length;
      html += '<li><button class="riga-argomento bordo-st-' + recArg(a.id).stato + '" onclick="apriMazzo(' + a.id + ')">' +
        pallino(a.id) + '<span class="titolo-arg">' + a.id + ". " + a.titolo + '</span><span class="mini">' + nc + ' carte</span><span class="freccia">›</span></button></li>';
    });
    html += "</ul>";
  });
  el.innerHTML = html;
}
function apriMazzo(id) {
  const a = CONTENUTI.find(function (x) { return x.id === id; });
  if (!a) return;
  flash = { carte: costruisciMazzo(a), i: 0, girata: false, titolo: a.id + ". " + a.titolo, area: a.area };
  mostraCarta();
}
function apriMazzoMescolato() {
  let tutte = [];
  CONTENUTI.forEach(function (a) {
    costruisciMazzo(a).forEach(function (c) { tutte.push({ d: c.d, r: c.r, tag: c.tag, arg: a.titolo, area: a.area }); });
  });
  tutte = mescola(tutte).slice(0, 30);
  flash = { carte: tutte, i: 0, girata: false, titolo: "Mazzo misto", area: null, misto: true };
  mostraCarta();
}
function mostraCarta() {
  const el = document.getElementById("vista-flashcard");
  const c = flash.carte[flash.i], n = flash.carte.length;
  const areaTag = flash.misto ? tagArea(c.area) : (flash.area ? tagArea(flash.area) : "");
  let html = '<div class="quiz-meta"><span>' + flash.titolo + '</span><span>🃏 ' + (flash.i + 1) + " / " + n + "</span></div>" +
    '<div class="flash-scene"><div class="flip-card' + (flash.girata ? " girata" : "") + '" id="flip-card" onclick="giraCarta()">' +
    '<div class="flip-face flip-front"><div class="fc-tag">' + areaTag + (c.tag || "Domanda") + '</div>' +
    '<div class="fc-corpo"><div class="fc-domanda">' + c.d + '</div></div><div class="fc-hint">Tocca per girare ↻</div></div>' +
    '<div class="flip-face flip-back"><div class="fc-tag">' + (flash.misto ? c.arg : "Risposta") + '</div>' +
    '<div class="fc-corpo"><div class="fc-risposta">' + c.r + '</div></div><div class="fc-hint">Tocca per tornare ↺</div></div>' +
    "</div></div>";
  html += '<div class="flash-nav"><button onclick="cartaPrec()" ' + (flash.i === 0 ? "disabled" : "") + ">‹ Prec</button>" +
    '<span class="conta">' + (flash.i + 1) + " / " + n + "</span>" +
    '<button onclick="cartaSucc()">' + (flash.i >= n - 1 ? "Fine ✓" : "Succ ›") + "</button></div>" +
    '<button class="btn-largo btn-fantasma" onclick="renderFlashcardIdle()">Chiudi il mazzo</button>';
  el.innerHTML = html;
  window.scrollTo(0, 0);
  typeset(el);
}
function giraCarta() {
  flash.girata = !flash.girata;
  const card = document.getElementById("flip-card");
  if (card) card.classList.toggle("girata", flash.girata);
}
function cartaPrec() {
  if (flash.i > 0) { flash.i--; flash.girata = false; mostraCarta(); }
}
function cartaSucc() {
  if (flash.i >= flash.carte.length - 1) { renderFlashcardIdle(); return; }
  flash.i++; flash.girata = false; mostraCarta();
}

// ============================================================
// Vista DIMOSTRAZIONI (tutte le derivazioni, rivelate passo-passo)
// ============================================================
let dimo = null;
function argomentiConDerivazione() {
  return CONTENUTI.filter(function (a) { return a.derivazione && a.derivazione.length; });
}
function renderDimostrazioniIdle() {
  dimo = null;
  const el = document.getElementById("vista-dimostrazioni");
  const lista = argomentiConDerivazione();
  const passiTot = lista.reduce(function (s, a) { return s + a.derivazione.length; }, 0);
  let html = "<h2>Dimostrazioni</h2>" +
    '<p class="mini">Tutte le ' + lista.length + " derivazioni delle formule (" + passiTot + " passaggi in totale), da ricavare <b>un passo alla volta</b>. Prova prima a mente, poi rivela e verifica.</p>" +
    '<button class="btn-primario btn-largo" onclick="apriDimostrazione(' + lista[0].id + ')" style="margin-bottom:8px">▶️ Inizia dalla prima e scorrile tutte</button>';
  Object.keys(AREE).forEach(function (area) {
    const ag = lista.filter(function (a) { return a.area === area; });
    if (!ag.length) return;
    html += "<h3>" + tagArea(area) + AREE[area] + '</h3><ul class="lista-argomenti stagger">';
    ag.forEach(function (a) {
      html += '<li><button class="riga-argomento bordo-st-' + recArg(a.id).stato + '" onclick="apriDimostrazione(' + a.id + ')">' +
        pallino(a.id) + '<span class="titolo-arg">' + a.id + ". " + a.titolo + '</span><span class="mini">' + a.derivazione.length + ' passi</span><span class="freccia">›</span></button></li>';
    });
    html += "</ul>";
  });
  el.innerHTML = html;
}
function apriDimostrazione(id) {
  const lista = argomentiConDerivazione();
  const pos = lista.findIndex(function (a) { return a.id === id; });
  if (pos < 0) return;
  dimo = { lista: lista, pos: pos, mostrati: 1 }; // il primo passo è già visibile
  mostraDimostrazione(true);
}
function mostraDimostrazione(scrolla) {
  const el = document.getElementById("vista-dimostrazioni");
  const a = dimo.lista[dimo.pos], n = a.derivazione.length;
  const perc = Math.round(100 * dimo.mostrati / n);
  let html = '<div class="quiz-meta"><span>Dimostrazione ' + (dimo.pos + 1) + " / " + dimo.lista.length + '</span><span>📐 ' + dimo.mostrati + " / " + n + " passi</span></div>" +
    '<div class="quiz-barra"><span style="width:' + perc + '%"></span></div>' +
    '<div class="card"><div class="quiz-tipo-tag">' + tagArea(a.area) + "DERIVAZIONE</div>" +
    '<div class="quiz-domanda">' + a.id + ". " + a.titolo + "</div>";
  if (a.formuleChiave && a.formuleChiave.length) {
    html += '<div class="dim-goal"><span class="cap">🎯 Obiettivo — ricavare</span>' +
      a.formuleChiave.map(function (f) { return '<div class="formula-riga">' + f + "</div>"; }).join("") + "</div>";
  }
  html += '<p class="dim-prompt"><b>Ipotesi:</b> ' + a.ipotesi + "</p></div>";
  // passi rivelati finora
  for (let i = 0; i < dimo.mostrati && i < n; i++) {
    const p = a.derivazione[i];
    html += '<div class="passo-dim"><div class="passo-derivazione"><div class="p-passo">' + (i + 1) + ". " + p.passo +
      '</div><div class="p-formula">' + p.formula + '</div><div class="p-commento">' + p.commento + "</div></div></div>";
  }
  // controlli di rivelazione
  html += '<div id="dim-controlli">';
  if (dimo.mostrati < n) {
    html += '<button class="btn-primario btn-largo" onclick="rivelaPasso()">Mostra passo ' + (dimo.mostrati + 1) + " / " + n + " →</button>" +
      '<button class="btn-largo" onclick="rivelaTuttiPassi()">Mostra tutti i passaggi</button>' +
      '<div class="dim-restanti">ancora ' + (n - dimo.mostrati) + " passagg" + ((n - dimo.mostrati) === 1 ? "io" : "i") + " da rivelare</div>";
  } else {
    html += '<div class="dim-completa">✓ Dimostrazione completa</div>' +
      '<button class="btn-largo" onclick="resetDimostrazione()">↺ Ricomincia da capo</button>';
  }
  html += "</div>";
  // navigazione tra tutte le dimostrazioni
  html += '<div class="dim-nav"><button onclick="dimoPrec()" ' + (dimo.pos === 0 ? "disabled" : "") + ">‹ Prec</button>" +
    '<span class="conta">' + (dimo.pos + 1) + " / " + dimo.lista.length + "</span>" +
    '<button onclick="dimoSucc()" ' + (dimo.pos >= dimo.lista.length - 1 ? "disabled" : "") + ">Succ ›</button></div>" +
    '<button class="btn-largo btn-fantasma" onclick="apriScheda(' + a.id + ')">📖 Apri la scheda completa</button>' +
    '<button class="btn-largo btn-fantasma" onclick="renderDimostrazioniIdle()">Torna all\'elenco</button>';
  el.innerHTML = html;
  typeset(el);
  if (scrolla) window.scrollTo(0, 0);
  else { const c = document.getElementById("dim-controlli"); if (c) c.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function rivelaPasso() {
  const n = dimo.lista[dimo.pos].derivazione.length;
  if (dimo.mostrati < n) { dimo.mostrati++; mostraDimostrazione(false); }
}
function rivelaTuttiPassi() {
  dimo.mostrati = dimo.lista[dimo.pos].derivazione.length;
  mostraDimostrazione(false);
}
function resetDimostrazione() { dimo.mostrati = 1; mostraDimostrazione(true); }
function dimoPrec() { if (dimo.pos > 0) { dimo.pos--; dimo.mostrati = 1; mostraDimostrazione(true); } }
function dimoSucc() { if (dimo.pos < dimo.lista.length - 1) { dimo.pos++; dimo.mostrati = 1; mostraDimostrazione(true); } }

function aggiornaCountdown() {

  const testo = gg > 0 ? "⏳ " + gg + " g all'esame" : (gg === 0 ? "🎓 Esame oggi!" : "");

// ============================================================
// SIMULAZIONI INTERATTIVE — canvas leggeri, partono da soli
// Ogni voce: funzione(box) -> funzione di cleanup
// ============================================================
const SIM_COL = { fg: "#eef1fa", fg2: "#9aa4bd", acc: "#8b93ff", acc2: "#b7bcff", ok: "#37e0a0", warn: "#ffb454", bad: "#ff6b6b", viola: "#cf9bff" };

function simCanvas(box, altezza) {
  const cv = document.createElement("canvas");
  box.appendChild(cv);
  const W = Math.min(box.clientWidth || 640, 760);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = altezza * dpr;
  cv.style.height = altezza + "px";
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  return { cv: cv, ctx: ctx, W: W, H: altezza };
}
function simControlli(box) {
  const div = document.createElement("div");
  div.className = "sim-controlli";
  box.appendChild(div);
  return div;
}
function simSlider(cont, etichetta, min, max, step, val, formato) {
  const riga = document.createElement("div");
  riga.className = "sim-riga";
  const lab = document.createElement("label"); lab.textContent = etichetta;
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = min; inp.max = max; inp.step = step; inp.value = val;
  const out = document.createElement("output");
  const aggiorna = function () { out.textContent = (formato || function (v) { return v; })(parseFloat(inp.value)); };
  inp.addEventListener("input", aggiorna);
  aggiorna();
  riga.appendChild(lab); riga.appendChild(inp); riga.appendChild(out);
  cont.appendChild(riga);
  return inp;
}
function simLegenda(box, testo) {
  const p = document.createElement("p");
  p.className = "sim-legenda"; p.innerHTML = testo;
  box.appendChild(p);
}
function simLoop(draw) {
  let vivo = true, id;
  const t0 = performance.now();
  function frame(ts) {
    if (!vivo) return;
    draw((ts - t0) / 1000);
    id = requestAnimationFrame(frame);
  }
  id = requestAnimationFrame(frame);
  return function () { vivo = false; cancelAnimationFrame(id); };
}
function freccia(ctx, x1, y1, x2, y2, colore) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  if (L < 2) { ctx.fillStyle = colore; ctx.beginPath(); ctx.arc(x1, y1, 3.5, 0, 7); ctx.fill(); return; }
  const ux = dx / L, uy = dy / L;
  ctx.strokeStyle = colore; ctx.fillStyle = colore; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * 7, y2 - uy * 7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * 9 - uy * 4.5, y2 - uy * 9 + ux * 4.5);
  ctx.lineTo(x2 - ux * 9 + uy * 4.5, y2 - uy * 9 - ux * 4.5);
  ctx.closePath(); ctx.fill();
}

const SIMS = {};

// ---- 2. Moto armonico: massa oscillante + grafico x(t) ----
SIMS[2] = function (box) {
  const c = simCanvas(box, 240);
  const ctr = simControlli(box);
  const sA = simSlider(ctr, "Ampiezza A", 0.2, 1, 0.01, 0.7, function (v) { return v.toFixed(2) + " m"; });
  const sW = simSlider(ctr, "Pulsazione ω", 0.5, 4, 0.05, 2, function (v) { return v.toFixed(2) + " rad/s"; });
  const sF = simSlider(ctr, "Fase φ", 0, 6.28, 0.01, 0, function (v) { return v.toFixed(2) + " rad"; });
  simLegenda(box, "La massa (a sinistra) e il grafico \\(x(t)\\) che si disegna in tempo reale. Nota: cambiare A non cambia il periodo \\(T = 2\\pi/\\omega\\).");
  typeset(box);
  const storia = [];
  return simLoop(function (t) {
    const A = +sA.value, w = +sW.value, f = +sF.value;
    const x = A * Math.cos(w * t + f);
    storia.push(x); if (storia.length > 260) storia.shift();
    const ctx = c.ctx, W = c.W, H = c.H, cy = H / 2, scala = (H / 2 - 26);
    ctx.clearRect(0, 0, W, H);
    // guida massa
    const mx = 54, my = cy - x * scala;
    ctx.strokeStyle = "#2c3150"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mx, 14); ctx.lineTo(mx, H - 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24, cy); ctx.lineTo(W - 10, cy); ctx.stroke();
    // molla stilizzata
    ctx.strokeStyle = SIM_COL.fg2; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(mx, 14);
    const nS = 8, len = my - 14;
    for (let i = 1; i <= nS; i++) ctx.lineTo(mx + ((i % 2) ? 8 : -8), 14 + len * i / (nS + 1));
    ctx.lineTo(mx, my); ctx.stroke();
    // massa
    ctx.fillStyle = SIM_COL.acc;
    ctx.beginPath(); ctx.arc(mx, my, 13, 0, 7); ctx.fill();
    // grafico x(t)
    ctx.strokeStyle = SIM_COL.acc2; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < storia.length; i++) {
      const gx = W - 10 - (storia.length - 1 - i) * ((W - 100) / 260);
      const gy = cy - storia[i] * scala;
      (i === 0) ? ctx.moveTo(gx, gy) : ctx.lineTo(gx, gy);
    }
    ctx.stroke();
    ctx.fillStyle = SIM_COL.fg2; ctx.font = "12px sans-serif";
    ctx.fillText("T = " + (2 * Math.PI / w).toFixed(2) + " s", W - 110, 20);
    ctx.fillText("x = " + x.toFixed(2) + " m", W - 110, 36);
  });
};

// ---- 4. Pendolo: dinamica esatta vs piccole oscillazioni ----
SIMS[4] = function (box) {
  const c = simCanvas(box, 260);
  const ctr = simControlli(box);
  const sL = simSlider(ctr, "Lunghezza L", 0.5, 2, 0.05, 1, function (v) { return v.toFixed(2) + " m"; });
  const sT = simSlider(ctr, "Ampiezza θ₀", 5, 90, 1, 20, function (v) { return v.toFixed(0) + "°"; });
  simLegenda(box, "Pendolo <b>reale</b> (pieno) e pendolo <b>armonico ideale</b> (trasparente). A piccoli angoli si sovrappongono; oltre i ~30° il reale resta indietro: l'isocronismo cede.");
  const g = 9.81;
  let th, om, thLin0, tSim, prevL = 0, prevT0 = 0;
  function reset() {
    thLin0 = (+sT.value) * Math.PI / 180;
    th = thLin0; om = 0; tSim = 0;
    prevL = +sL.value; prevT0 = +sT.value;
  }
  reset();
  sL.addEventListener("input", reset);
  sT.addEventListener("input", reset);
  let ultimo = 0;
  return simLoop(function (t) {
    const L = +sL.value, dt = Math.min(t - ultimo, 0.05); ultimo = t;
    // integrazione semi-implicita del pendolo esatto
    const passi = 8, h = dt / passi;
    for (let i = 0; i < passi; i++) {
      om += -(g / L) * Math.sin(th) * h;
      th += om * h;
    }
    tSim += dt;
    const w0 = Math.sqrt(g / L);
    const thLin = thLin0 * Math.cos(w0 * tSim);
    const ctx = c.ctx, W = c.W, H = c.H, px = W / 2, py = 34, raggio = (H - 70) * (L / 2);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#2c3150"; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + raggio + 20); ctx.stroke();
    // pendolo lineare (fantasma)
    const lx = px + raggio * Math.sin(thLin), ly = py + raggio * Math.cos(thLin);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = SIM_COL.fg2; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = SIM_COL.fg2; ctx.beginPath(); ctx.arc(lx, ly, 11, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // pendolo reale
    const bx = px + raggio * Math.sin(th), by = py + raggio * Math.cos(th);
    ctx.strokeStyle = SIM_COL.fg; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = SIM_COL.acc; ctx.beginPath(); ctx.arc(bx, by, 13, 0, 7); ctx.fill();
    ctx.fillStyle = "#3c4360"; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
    // periodi
    const T0 = 2 * Math.PI * Math.sqrt(L / g);
    const t0q = thLin0 * thLin0;
    const Tre = T0 * (1 + t0q / 16 + 11 * t0q * t0q / 3072);
    ctx.fillStyle = SIM_COL.fg2; ctx.font = "12px sans-serif";
    ctx.fillText("T piccole osc. = " + T0.toFixed(3) + " s", 12, 20);
    ctx.fillText("T reale ≈ " + Tre.toFixed(3) + " s  (+" + (100 * (Tre - T0) / T0).toFixed(1) + "%)", 12, 36);
  });
};

// ---- 6. Oscillatore smorzato: i tre regimi ----
SIMS[6] = function (box) {
  const c = simCanvas(box, 230);
  const ctr = simControlli(box);
  const w0 = 2;
  const sG = simSlider(ctr, "Smorzamento γ", 0, 3.5, 0.02, 0.3, function (v) { return v.toFixed(2) + " s⁻¹"; });
  simLegenda(box, "ω₀ = 2 rad/s fissata. Muovi γ e attraversa i tre regimi: <b>sottosmorzato</b> (γ&lt;ω₀, oscilla dentro l'inviluppo), <b>critico</b> (γ=ω₀, ritorno più rapido), <b>sovrasmorzato</b> (γ&gt;ω₀, ritorno lento senza oscillare).");
  function xDi(t, g) {
    if (Math.abs(g - w0) < 1e-3) return (1 + w0 * t) * Math.exp(-w0 * t);
    if (g < w0) {
      const ws = Math.sqrt(w0 * w0 - g * g);
      return Math.exp(-g * t) * (Math.cos(ws * t) + (g / ws) * Math.sin(ws * t));
    }
    const s = Math.sqrt(g * g - w0 * w0), l1 = -g + s, l2 = -g - s;
    return (l2 * Math.exp(l1 * t) - l1 * Math.exp(l2 * t)) / (l2 - l1);
  }
  const T = 10;
  return simLoop(function (t) {
    const g = +sG.value;
    const ctx = c.ctx, W = c.W, H = c.H, cy = H / 2, sx = (W - 50) / T, sy = H / 2 - 24;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#2c3150"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(36, cy); ctx.lineTo(W - 8, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(36, 10); ctx.lineTo(36, H - 10); ctx.stroke();
    // inviluppo
    if (g < w0 && g > 0.01) {
      ctx.strokeStyle = "#3c4360"; ctx.setLineDash([4, 4]);
      [1, -1].forEach(function (s) {
        ctx.beginPath();
        for (let i = 0; i <= 200; i++) {
          const tt = T * i / 200, y = cy - s * Math.exp(-g * tt) * sy;
          (i === 0) ? ctx.moveTo(36 + tt * sx, y) : ctx.lineTo(36 + tt * sx, y);
        }
        ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    // curva
    const regime = (Math.abs(g - w0) < 0.06) ? "critico" : (g < w0 ? "sottosmorzato" : "sovrasmorzato");
    const colore = regime === "critico" ? SIM_COL.warn : (regime === "sottosmorzato" ? SIM_COL.acc2 : SIM_COL.viola);
    ctx.strokeStyle = colore; ctx.lineWidth = 2.3;
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const tt = T * i / 300, y = cy - xDi(tt, g) * sy;
      (i === 0) ? ctx.moveTo(36 + tt * sx, y) : ctx.lineTo(36 + tt * sx, y);
    }
    ctx.stroke();
    // punto animato
    const tp = t % T;
    ctx.fillStyle = colore;
    ctx.beginPath(); ctx.arc(36 + tp * sx, cy - xDi(tp, g) * sy, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = colore; ctx.font = "bold 13px sans-serif";
    ctx.fillText("Regime: " + regime, 44, 20);
  });
};

// ---- 7. Risonanza: curva A(Ω) al variare di γ ----
SIMS[7] = function (box) {
  const c = simCanvas(box, 230);
  const ctr = simControlli(box);
  const w0 = 2;
  const sG = simSlider(ctr, "Smorzamento γ", 0.06, 1.2, 0.01, 0.4, function (v) { return v.toFixed(2) + " s⁻¹"; });
  simLegenda(box, "Ampiezza a regime in funzione della pulsazione della forzante (ω₀ = 2 rad/s). Riduci γ: il picco <b>si alza e si stringe</b> attorno a ω₀. A Ω→0 la risposta è quella statica F₀/k.");
  function A(om, g) { const d = w0 * w0 - om * om; return 1 / Math.sqrt(d * d + 4 * g * g * om * om); }
  const OMAX = 4, YMAX = 4.5;
  return simLoop(function (t) {
    const g = +sG.value;
    const ctx = c.ctx, W = c.W, H = c.H, x0 = 40, y0 = H - 26, sx = (W - 55) / OMAX, sy = (H - 46) / YMAX;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#2c3150";
    ctx.beginPath(); ctx.moveTo(x0, 8); ctx.lineTo(x0, y0); ctx.lineTo(W - 8, y0); ctx.stroke();
    // riferimento ω0
    ctx.setLineDash([4, 4]); ctx.beginPath();
    ctx.moveTo(x0 + w0 * sx, y0); ctx.lineTo(x0 + w0 * sx, 12); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = SIM_COL.fg2; ctx.font = "12px sans-serif";
    ctx.fillText("ω₀", x0 + w0 * sx - 8, y0 + 16);
    // curva
    ctx.strokeStyle = SIM_COL.acc2; ctx.lineWidth = 2.3;
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const om = OMAX * i / 300, y = y0 - Math.min(A(om, g), YMAX) * sy;
      (i === 0) ? ctx.moveTo(x0 + om * sx, y) : ctx.lineTo(x0 + om * sx, y);
    }
    ctx.stroke();
    // picco
    const or2 = w0 * w0 - 2 * g * g;
    if (or2 > 0) {
      const orx = Math.sqrt(or2), Am = A(orx, g);
      ctx.fillStyle = SIM_COL.warn;
      ctx.beginPath(); ctx.arc(x0 + orx * sx, y0 - Math.min(Am, YMAX) * sy, 5, 0, 7); ctx.fill();
      ctx.fillText = ctx.fillText;
      ctx.fillStyle = SIM_COL.fg2;
      ctx.fillText("Ω_ris = " + orx.toFixed(2) + "   A_max = " + Am.toFixed(2), x0 + 10, 22);
    } else {
      ctx.fillStyle = SIM_COL.fg2;
      ctx.fillText("γ troppo grande: nessun picco (γ² > ω₀²/2)", x0 + 10, 22);
    }
    // scan animato
    const om = OMAX * ((t * 0.25) % 1);
    ctx.fillStyle = SIM_COL.acc;
    ctx.beginPath(); ctx.arc(x0 + om * sx, y0 - Math.min(A(om, g), YMAX) * sy, 4, 0, 7); ctx.fill();
  });
};

// ---- 13. Momenti d'inerzia: la gara sul piano inclinato ----
SIMS[13] = function (box) {
  const c = simCanvas(box, 250);
  const ctr = simControlli(box);
  const sTh = simSlider(ctr, "Inclinazione θ", 10, 30, 1, 18, function (v) { return v.toFixed(0) + "°"; });
  simLegenda(box, "Sfera (β=2/5), disco (β=1/2) e anello (β=1) partono insieme: vince chi ha meno inerzia rotazionale relativa, \\(a = g\\sin\\theta/(1+\\beta)\\) — indipendentemente da massa e raggio.");
  typeset(box);
  const corpi = [
    { nome: "sfera", beta: 0.4, col: SIM_COL.ok },
    { nome: "disco", beta: 0.5, col: SIM_COL.acc2 },
    { nome: "anello", beta: 1, col: SIM_COL.warn }
  ];
  const g = 9.81, Lpista = 3; // metri
  let t0 = null;
  return simLoop(function (t) {
    if (t0 === null) t0 = t;
    const th = (+sTh.value) * Math.PI / 180;
    const ctx = c.ctx, W = c.W, H = c.H;
    ctx.clearRect(0, 0, W, H);
    const margine = 20, lunghezza = W - margine * 2, R = 15;
    let tuttiArrivati = true;
    corpi.forEach(function (b, i) {
      const y = 48 + i * 68;
      const a = g * Math.sin(th) / (1 + b.beta);
      let s = 0.5 * a * Math.pow(t - t0, 2);
      const arrivato = s >= Lpista;
      if (!arrivato) tuttiArrivati = false;
      s = Math.min(s, Lpista);
      const x = margine + R + (lunghezza - 2 * R) * (s / Lpista);
      // pista
      ctx.strokeStyle = "#2c3150"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(margine, y + R + 2); ctx.lineTo(W - margine, y + R + 2); ctx.stroke();
      // corpo con raggio-marcatore che ruota
      const phi = s / (R / 60); // rotazione visiva
      ctx.strokeStyle = b.col; ctx.fillStyle = b.col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke();
      if (b.nome === "sfera") { ctx.globalAlpha = .3; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      if (b.nome === "disco") { ctx.globalAlpha = .15; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + R * Math.cos(phi), y + R * Math.sin(phi)); ctx.stroke();
      ctx.font = "12px sans-serif"; ctx.fillStyle = SIM_COL.fg2;
      ctx.fillText(b.nome + "  (a = " + a.toFixed(2) + " m/s²)", margine, y - R - 6);
      if (arrivato) { ctx.fillStyle = b.col; ctx.fillText("🏁", W - margine + 2, y + 4); }
    });
    if (tuttiArrivati && t - t0 > 0.5) t0 = t + 0.8; // pausa e si riparte
  });
};

// ---- 20. Rotolamento: campo delle velocità sulla ruota ----
SIMS[20] = function (box) {
  const c = simCanvas(box, 250);
  const ctr = simControlli(box);
  const sV = simSlider(ctr, "Velocità v", 30, 120, 1, 60, function (v) { return (v / 60).toFixed(1) + " m/s"; });
  simLegenda(box, "Ogni punto della ruota ha velocità \\(\\vec{v}_{cm} + \\vec{\\omega}\\times\\vec{r}\\). Guarda il punto di contatto: la sua velocità è <b>zero</b> — per questo l'attrito statico non dissipa. Il punto in cima viaggia a 2v.");
  typeset(box);
  const R = 46;
  return simLoop(function (t) {
    const v = +sV.value;
    const ctx = c.ctx, W = c.W, H = c.H, suolo = H - 40;
    ctx.clearRect(0, 0, W, H);
    // suolo
    ctx.strokeStyle = "#2c3150"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, suolo); ctx.lineTo(W, suolo); ctx.stroke();
    for (let x = (-(v * t) % 26); x < W; x += 26) {
      ctx.beginPath(); ctx.moveTo(x, suolo); ctx.lineTo(x - 8, suolo + 9); ctx.stroke();
    }
    const cx = ((v * t) % (W + 2 * R)) - R, cy = suolo - R;
    const om = v / R, phi = (v * t) / R;
    // ruota
    ctx.strokeStyle = SIM_COL.fg; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    for (let k = 0; k < 4; k++) {
      const a = phi + k * Math.PI / 2;
      ctx.strokeStyle = "#3c4360"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); ctx.stroke();
    }
    // vettori velocità in 5 punti: centro, cima, contatto, davanti, dietro
    const punti = [
      { dx: 0, dy: 0, nome: "centro" },
      { dx: 0, dy: -R, nome: "cima" },
      { dx: 0, dy: R, nome: "contatto" },
      { dx: R, dy: 0, nome: "" },
      { dx: -R, dy: 0, nome: "" }
    ];
    const kv = 0.55; // scala visiva dei vettori
    punti.forEach(function (p) {
      const px = cx + p.dx, py = cy + p.dy;
      const vx = v + om * (-p.dy) * 1, vy = om * (p.dx);
      const col = (p.nome === "contatto") ? SIM_COL.bad : (p.nome === "cima" ? SIM_COL.ok : SIM_COL.acc2);
      freccia(c.ctx, px, py, px + vx * kv, py + vy * kv, col);
      ctx.font = "11px sans-serif"; ctx.fillStyle = SIM_COL.fg2;
      if (p.nome) ctx.fillText(p.nome + (p.nome === "contatto" ? " (v = 0)" : p.nome === "cima" ? " (2v)" : " (v)"), px + 8, py + (p.dy >= 0 ? 24 : -12));
    });
  });
};

// ---- 21. Urti centrali: masse e restituzione ----
SIMS[21] = function (box) {
  const c = simCanvas(box, 200);
  const ctr = simControlli(box);
  const sM = simSlider(ctr, "Rapporto m₂/m₁", 0.2, 5, 0.1, 1, function (v) { return v.toFixed(1); });
  const sE = simSlider(ctr, "Restituzione e", 0, 1, 0.05, 1, function (v) { return v.toFixed(2); });
  simLegenda(box, "m₁ arriva a 2 m/s su m₂ fermo. <b>e = 1</b>: urto elastico (masse uguali → scambio di velocità). <b>e = 0</b>: perfettamente anelastico (restano attaccati alla velocità del centro di massa).");
  const v1i = 2;
  let x1, x2, v1, v2, urtato, tUrto, tPrec = 0;
  function reset() {
    x1 = 0.6; x2 = 3.6; v1 = v1i; v2 = 0; urtato = false; tUrto = 0;
  }
  reset();
  sM.addEventListener("input", reset);
  sE.addEventListener("input", reset);
  return simLoop(function (t) {
    const dt = Math.min(t - tPrec, 0.05); tPrec = t;
    const m2 = +sM.value, e = +sE.value, m1 = 1;
    const ctx = c.ctx, W = c.W, H = c.H, suolo = H - 44;
    const r1 = 16, r2 = 16 * Math.cbrt(m2);
    const scala = W / 6; // 6 metri visibili
    // aggiorno posizioni (in metri)
    x1 += v1 * dt; x2 += v2 * dt;
    // urto
    if (!urtato && x1 * scala + r1 >= x2 * scala - r2) {
      const u1 = ((m1 - e * m2) * v1 + (1 + e) * m2 * v2) / (m1 + m2);
      const u2 = ((m2 - e * m1) * v2 + (1 + e) * m1 * v1) / (m1 + m2);
      v1 = u1; v2 = u2; urtato = true; tUrto = t;
    }
    // reset quando escono dallo schermo o restano fermi a lungo
    if (urtato && (Math.min(x1, x2) * scala > W + 60 || t - tUrto > 4)) reset();
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#2c3150"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, suolo + Math.max(r1, r2)); ctx.lineTo(W, suolo + Math.max(r1, r2)); ctx.stroke();
    // corpi
    ctx.fillStyle = SIM_COL.acc;
    ctx.beginPath(); ctx.arc(x1 * scala, suolo + Math.max(r1, r2) - r1, r1, 0, 7); ctx.fill();
    ctx.fillStyle = SIM_COL.warn;
    ctx.beginPath(); ctx.arc(x2 * scala, suolo + Math.max(r1, r2) - r2, r2, 0, 7); ctx.fill();
    ctx.font = "12px sans-serif"; ctx.fillStyle = SIM_COL.fg2;
    ctx.fillText("m₁: v = " + v1.toFixed(2) + " m/s", 14, 24);
    ctx.fillText("m₂: v = " + v2.toFixed(2) + " m/s", 14, 42);
    if (urtato) {
      const Ki = 0.5 * m1 * v1i * v1i;
      const Kf = 0.5 * m1 * v1 * v1 + 0.5 * m2 * v2 * v2;
      ctx.fillText("K conservata: " + Math.round(100 * Kf / Ki) + "%", W - 150, 24);
    }
  });
};

// ---- 30. Ciclo di Carnot nel piano p-V ----
SIMS[30] = function (box) {
  const c = simCanvas(box, 270);
  const ctr = simControlli(box);
  const sTc = simSlider(ctr, "T calda", 400, 600, 5, 500, function (v) { return v.toFixed(0) + " K"; });
  const sTf = simSlider(ctr, "T fredda", 250, 350, 5, 300, function (v) { return v.toFixed(0) + " K"; });
  simLegenda(box, "Le 4 trasformazioni percorse in sequenza: isoterma calda → adiabatica → isoterma fredda → adiabatica. L'<b>area racchiusa</b> è il lavoro netto; il rendimento dipende solo dalle temperature.");
  const gam = 5 / 3, nR = 1, V1 = 1, V2 = 2;
  function puntiCiclo(Tc, Tf) {
    const k = Math.pow(Tc / Tf, 1 / (gam - 1));
    return { V1: V1, V2: V2, V3: V2 * k, V4: V1 * k, Tc: Tc, Tf: Tf };
  }
  return simLoop(function (t) {
    const Tc = +sTc.value, Tf = +sTf.value;
    const P = puntiCiclo(Tc, Tf);
    const ctx = c.ctx, W = c.W, H = c.H;
    const Vmax = P.V3 * 1.08, pmax = nR * Tc / V1 * 1.06;
    const x0 = 42, y0 = H - 30;
    const X = function (V) { return x0 + (V / Vmax) * (W - x0 - 12); };
    const Y = function (p) { return y0 - (p / pmax) * (y0 - 14); };
    // campiono i 4 tratti
    function tratto(seg, u) { // seg 0..3, u 0..1 → {V, p}
      let V, p;
      if (seg === 0) { V = P.V1 + (P.V2 - P.V1) * u; p = nR * Tc / V; }
      else if (seg === 1) { V = P.V2 + (P.V3 - P.V2) * u; p = nR * Tc * Math.pow(P.V2, gam - 1) / Math.pow(V, gam); }
      else if (seg === 2) { V = P.V3 + (P.V4 - P.V3) * u; p = nR * Tf / V; }
      else { V = P.V4 + (P.V1 - P.V4) * u; p = nR * Tf * Math.pow(P.V4, gam - 1) / Math.pow(V, gam); }
      return { V: V, p: p };
    }
    ctx.clearRect(0, 0, W, H);
    // area del ciclo
    ctx.beginPath();
    for (let s = 0; s < 4; s++) for (let i = 0; i <= 40; i++) {
      const q = tratto(s, i / 40);
      (s === 0 && i === 0) ? ctx.moveTo(X(q.V), Y(q.p)) : ctx.lineTo(X(q.V), Y(q.p));
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(139,147,255,.18)"; ctx.fill();
    // assi
    ctx.strokeStyle = "#2c3150"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, 10); ctx.lineTo(x0, y0); ctx.lineTo(W - 8, y0); ctx.stroke();
    ctx.fillStyle = SIM_COL.fg2; ctx.font = "11px sans-serif";
    ctx.fillText("V", W - 18, y0 + 16); ctx.fillText("p", x0 - 22, 20);
    // i 4 tratti colorati
    const colori = [SIM_COL.bad, SIM_COL.fg2, SIM_COL.acc2, SIM_COL.fg2];
    for (let s = 0; s < 4; s++) {
      ctx.strokeStyle = colori[s]; ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const q = tratto(s, i / 60);
        (i === 0) ? ctx.moveTo(X(q.V), Y(q.p)) : ctx.lineTo(X(q.V), Y(q.p));
      }
      ctx.stroke();
    }
    // punto che percorre il ciclo
    const fase = (t * 0.35) % 4, seg = Math.floor(fase), u = fase - seg;
    const q = tratto(seg, u);
    ctx.fillStyle = SIM_COL.warn;
    ctx.beginPath(); ctx.arc(X(q.V), Y(q.p), 6, 0, 7); ctx.fill();
    const nomi = ["1→2 isoterma T_C (assorbe Q_C)", "2→3 adiabatica (si raffredda)", "3→4 isoterma T_F (cede Q_F)", "4→1 adiabatica (si riscalda)"];
    ctx.fillStyle = SIM_COL.fg; ctx.font = "bold 12px sans-serif";
    ctx.fillText(nomi[seg], x0 + 10, 24);
    const eta = 1 - Tf / Tc;
    const W12 = nR * Tc * Math.log(V2 / V1);
    ctx.fillStyle = SIM_COL.fg2; ctx.font = "12px sans-serif";
    ctx.fillText("η = 1 − T_F/T_C = " + (eta * 100).toFixed(1) + "%   ·   W_netto = " + (eta * W12).toFixed(0) + " J (per Q_C = " + W12.toFixed(0) + " J)", x0 + 10, 42);
  });
};

</script>
